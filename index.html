                    var start2 = loc2.startRow, end2 = loc2.endRow;
                    if (isRest) {
                        // 二批：上界=首批起点-1（复用首批定位结果，避免与首批重叠读取）
                        var firstLoc = _sheetLocCache[sh2.id];
                        if (firstLoc) end2 = Math.min(end2, firstLoc.startRow - 1);
                    } else {
                        _sheetLocCache[sh2.id] = loc2;
                    }
                    if (end2 >= start2) range2 = 'A' + start2 + ':' + sh2.colEnd + end2;
                }
                if (!range2 && loc2) {
                    // 定位成功但区间为空（表数据不足2周/5周），无需读取
                    console.log('[计时] ' + phaseLabel + ' 抽检表 ' + sh2.name + ' 定位成功但区间为空，无需读取');
                    results.push({ ok: true, type: sh2.type, name: sh2.name, rows: [] });
                    continue;
                }
                if (!range2) {
                    // 定位失败：退化为表尾估算行数（原方案）
                    var rc2 = sheetRowCounts[sh2.id] || 0;
                    var est2 = Math.max(2, rc2 - (isRest ? sh2.fullRows : sh2.firstRows) + 1);
                    var upper2 = isRest ? (rc2 - sh2.firstRows) : rc2;
                    if (upper2 >= est2) range2 = 'A' + est2 + ':' + sh2.colEnd + upper2;
                    if (!isRest && upper2 >= est2) _sheetLocCache[sh2.id] = { startRow: est2, endRow: rc2 };
                }
                if (range2) {
                    rows2 = await fetchFeishuSheet(sh2.token, sh2.id, token, range2);
                }
                console.log('[计时] ' + phaseLabel + ' 抽检表 ' + sh2.name + ' 耗时 ' + (Date.now() - t0b) + 'ms, 行数 ' + rows2.length + (range2 ? ' (range:' + range2 + ')' : ''));
                results.push({ ok: true, type: sh2.type, name: sh2.name, rows: rows2 });
            } catch(e) {
                console.log('[计时] ' + phaseLabel + ' 抽检表 ' + sh2.name + ' 失败 耗时 ' + (Date.now() - t0b) + 'ms: ' + e.message);
                results.push({ ok: false, type: sh2.type, name: sh2.name, error: e.message });
            }
        }
    } finally {
        results.push(await supabaseTask);
    }
    console.log('[计时] ' + phaseLabel + ' 本阶段完成 总耗时 ' + (Date.now() - tAll) + 'ms');
    return results;
}

// 合并两阶段结果：二批(第3~5周)在前、首批(最近2周)在后（rows均已去表头并按日期裁剪，直接拼接）
function mergePhaseResults(firstList, restList) {
    return firstList.map(function(r) {
        if (!r.ok) return r;
        var mate = null;
        for (var i = 0; i < restList.length; i++) {
            if (restList[i].ok && restList[i].name === r.name) { mate = restList[i]; break; }
        }
        if (!mate) return r;
        if (r.rows && mate.rows && mate.rows.length > 0) {
            return Object.assign({}, r, { rows: mate.rows.concat(r.rows) });
        }
        if (r.dailyList && mate.dailyList && mate.dailyList.length > 0) {
            return Object.assign({}, r, { dailyList: mate.dailyList.concat(r.dailyList) });
        }
        return r;
    });
}

function processResults(results) {
    var errors = [];
    var sampling = { online: [], physical: [] };
    var status = {};

    results.forEach(function(res) {
        if (!res.ok) {
            status[res.name || res.source || res.type] = { ok: false, error: res.error };
            return;
        }
        if (res.source) {
            // 失误数据（fetchAllData已去表头并按日期裁剪，从第0行遍历）
            status[res.name] = { ok: true, count: (res.rows || []).length };
            for (var r = 0; r < res.rows.length; r++) {
                var row = res.rows[r];
                if (!row || row.length === 0) continue;
                var dateVal = row[res.colDate];
                if (dateVal === null || dateVal === undefined || dateVal === '日期') continue;
                var dateObj = parseDateValue(dateVal);
                if (!dateObj) continue;
                var category = (row[res.colCategory] || '').toString().trim();
                var reviewer = (row[res.colReviewer] || '').toString().trim();
                reviewer = reviewer.replace(/解答失误$/, '').replace(/解答$/, '').trim();
                var note = (row[res.colNote] || '').toString().trim();
                var site = (row[res.colSite] || '').toString().trim();
                if (!site && SITE_MAP[reviewer]) site = SITE_MAP[reviewer];
                var qcCode = (row[res.colQcCode] || '').toString().trim();
                var product = res.colProduct >= 0 ? ((row[res.colProduct] || '') + '').trim() : '';
                if (!category && !note) continue;
                errors.push({
                    date: dateObj, dateStr: formatDate(dateObj),
                    site: site, qcCode: qcCode, category: category || '-',
                    reviewer: reviewer || '-', note: note || '-',
                    product: product || '-', source: res.source
                });
            }
        } else if (res.type === 'panze') {
            // 判责数据源（来自8pTEgS表）
            status[res.name] = { ok: true, count: (res.records || []).length };
            panZeRecords = res.records || [];
        } else if (res.type === 'panze_supabase') {
            // Supabase判责量（每日feishu_panze_*同步）
            status[res.name] = { ok: true, count: (res.dailyList || []).length };
            panZeSupabaseDaily = res.dailyList || [];
        } else if (res.type) {
            // 抽检数据源（线上/实物）（fetchAllData已去表头并按日期裁剪，从第0行遍历）
            status[res.name] = { ok: true, count: (res.rows || []).length };
            var arr = res.type === 'online' ? sampling.online : sampling.physical;
            for (var r2 = 0; r2 < res.rows.length; r2++) {
                var row2 = res.rows[r2];
                if (!row2 || !row2[0]) continue;
                var dateObj2 = parseDateValue(row2[0]);
                if (!dateObj2) continue;
                var site2 = String(row2[1] || '').trim();
                var reviewer2 = String(row2[5] || '').trim();  // F列=初审人（抽检明细表的抽检量按初审人计数）
                var sampler2 = String(row2[6] || '').trim();   // G列=抽检人（周报文本括号按抽检人计数）
                arr.push({ date: dateObj2, site: site2, reviewer: reviewer2, sampler: sampler2 });
            }
        }
    });

    errors.sort(function(a, b) { return b.date - a.date; });
    return { errors: errors, sampling: sampling, status: status };
}

// ==================== 7. 数据聚合计算 ====================
function siteMatch(item, siteFilter) {
    if (siteFilter === 'all') return true;
    return item.site === siteFilter;
}

function computeWeekData(errors, sampling, panZe, monday, sunday, siteFilter) {
    siteFilter = siteFilter || 'all';
    // 过滤本周失误 + 站点
    var weekErrors = errors.filter(function(e) { return isInWeek(e.date, monday, sunday) && siteMatch(e, siteFilter); });

    // 过滤本周抽检（线上+实物订单量）+ 站点
    var onlineInWeek = sampling.online.filter(function(s) { return isInWeek(s.date, monday, sunday) && siteMatch(s, siteFilter); });
    var physicalInWeek = sampling.physical.filter(function(s) { return isInWeek(s.date, monday, sunday) && siteMatch(s, siteFilter); });

    var onlineCount = onlineInWeek.length;
    var physicalCount = physicalInWeek.length;
    var totalSampling = onlineCount + physicalCount;

    // 按人聚合抽检量（线上+实物表按G列抽检人计数，与周报文本同一口径；不再读判责表）
    var personSampling = {};
    onlineInWeek.forEach(function(s) {
        var name = fixPanZeName(s.reviewer);
        if (!name) return;
        if (!personSampling[name]) personSampling[name] = { sampling: 0, online: 0, physical: 0, site: s.site };
        personSampling[name].sampling++;
        personSampling[name].online++;
        if (!personSampling[name].site && SITE_MAP[name]) personSampling[name].site = SITE_MAP[name];
    });
    physicalInWeek.forEach(function(s) {
        var name = fixPanZeName(s.reviewer);
        if (!name) return;
        if (!personSampling[name]) personSampling[name] = { sampling: 0, online: 0, physical: 0, site: s.site };
        personSampling[name].sampling++;
        personSampling[name].physical++;
        if (!personSampling[name].site && SITE_MAP[name]) personSampling[name].site = SITE_MAP[name];
    });

    // 按人聚合判责量（来自Supabase每日同步 feishu_panze_*，按周过滤）
    // 名字先过fixPanZeName统一口径；站点归属SITE_MAP优先，其次用本周抽检记录中的站点兜底（新人员）
    var personPanZeSupabase = {};
    var droppedPanZeNames = {}; // 无站点归属被丢弃的人（仅提示用）
    (panZeSupabaseDaily || []).forEach(function(daily) {
        if (isInWeek(daily.date, monday, sunday)) {
            var map = daily.map || {};
            Object.keys(map).forEach(function(rawName) {
                var name = fixPanZeName(rawName);
                if (!name) return;
                var personSite = SITE_MAP[name] || '';
                if (!personSite && personSampling[name]) personSite = personSampling[name].site || '';
                // 站点过滤：选具体站点时只保留该站点的人；站点不同是正常过滤，完全无归属才记入提示
                if (siteFilter !== 'all' && personSite !== siteFilter) {
                    if (!personSite) droppedPanZeNames[name] = (droppedPanZeNames[name] || 0) + 1;
                    return;
                }
                // map值 = {品类:数量}，每人当日判责量 = 各品类求和
                var v = map[rawName];
                var count = 0;
                if (v && typeof v === 'object') {
                    Object.keys(v).forEach(function(k) { count += Number(v[k]) || 0; });
                } else {
                    count = Number(v) || 0;
                }
                personPanZeSupabase[name] = (personPanZeSupabase[name] || 0) + count;
            });
        }
    });


    // 按人聚合失误量（按来源分）
    var personErrors = {};
    weekErrors.forEach(function(e) {
        var name = fixPanZeName(e.reviewer) || '未知';
        if (!personErrors[name]) personErrors[name] = { total: 0, 初审: 0, 抽检: 0, QA: 0 };
        personErrors[name].total++;
        if (e.source === '初审') personErrors[name]['初审']++;
        else if (e.source === '抽检') personErrors[name]['抽检']++;
        else if (e.source === 'QA') personErrors[name]['QA']++;
    });

    // 按人合并
    var allNames = new Set();
    Object.keys(personSampling).forEach(function(n) { allNames.add(n); });
    Object.keys(personErrors).forEach(function(n) { allNames.add(n); });
    Object.keys(personPanZeSupabase).forEach(function(n) { allNames.add(n); });

    var personStats = [];
    allNames.forEach(function(name) {
        var s = personSampling[name] || { sampling: 0, online: 0, physical: 0, site: SITE_MAP[name] || '' };
        var e = personErrors[name] || { total: 0, 初审: 0, 抽检: 0, QA: 0 };
        var pz = personPanZeSupabase[name] || 0;
        var cjErrs = e['抽检'] || 0;  // 只算抽检失误
        var totalErrs = cjErrs + (e['初审'] || 0) + (e['QA'] || 0);  // 抽检/初审/QA 总失误
        var acc = pz > 0 ? Math.max(0, (pz - totalErrs) / pz * 100) : null; // 判责准确率=(判责量-总失误)/判责量，无判责量为null
        var cov = pz > 0 ? Math.min(100, s.sampling / pz * 100) : 0;        // 抽检覆盖率=抽检量/判责量
        personStats.push({
            name: name,
            site: s.site || SITE_MAP[name] || '',
            sampling: s.sampling,
            online: s.online,
            physical: s.physical,
            panZe: pz,
            errors: cjErrs,  // 只显示抽检失误
            errorsCS: e['初审'],
            errorsCJ: e['抽检'],
            errorsQA: e['QA'],
            totalErrors: totalErrs,  // 抽检/初审/QA 失误总数
            rate: s.sampling > 0 ? (cjErrs / s.sampling * 100) : 0,
            accuracy: acc,
            samplingAccuracy: s.sampling > 0 ? Math.max(0, (s.sampling - cjErrs) / s.sampling * 100) : null, // 抽检准确率=(抽检量-抽检失误)/抽检量，无抽检量为null
            coverage: cov
        });
    });

    // 失误类别聚合（按来源分）
    var categoriesBySource = { 初审: {}, 抽检: {}, QA: {} };
    weekErrors.forEach(function(e) {
        var src = e.source;
        if (!categoriesBySource[src]) categoriesBySource[src] = {};
        var cat = e.category;
        categoriesBySource[src][cat] = (categoriesBySource[src][cat] || 0) + 1;
    });

    var categoryStats = {};
    Object.keys(categoriesBySource).forEach(function(src) {
        var cats = categoriesBySource[src];
        var sorted = Object.keys(cats).map(function(c) { return { name: c, count: cats[c] }; });
        sorted.sort(function(a, b) { return b.count - a.count; });
        categoryStats[src] = sorted;
    });

    // 抽检覆盖率相关
    var sampledPeople = Object.keys(personSampling).length;
    var allPeople = allNames.size;

    // 判责量：使用Supabase每日同步数据（优学堂后台每日汇总的每人判责总数）
    var supabaseTotal = 0;
    Object.keys(personPanZeSupabase).forEach(function(n) { supabaseTotal += personPanZeSupabase[n]; });
    var judgmentCount = supabaseTotal;

    // 抽检覆盖率 = 抽检量 / 判责量（注意：必须在judgmentCount之后计算）
    var coverage = judgmentCount > 0 ? (totalSampling / judgmentCount * 100) : 0;

    // 抽检准确率 = (抽检量 - 抽检失误量) / 抽检量
    var cjErrors = weekErrors.filter(function(e) { return e.source === '抽检'; }).length;
    var accuracy = totalSampling > 0 ? ((totalSampling - cjErrors) / totalSampling * 100) : 100;

    // 有效抽检天数
    var distinctDates = {};
    onlineInWeek.forEach(function(s) { distinctDates[formatDate(s.date)] = 1; });
    physicalInWeek.forEach(function(s) { distinctDates[formatDate(s.date)] = 1; });
    var activeDays = Object.keys(distinctDates).length;

    // 抽检日均人效 = 抽检量 / 有效天数
    var dailyAvgEfficiency = activeDays > 0 ? Math.round(totalSampling / activeDays) : 0;

    // 判责准确率 = (判责量 - 总失误数) / 判责量
    var panZeAccuracy = judgmentCount > 0 ? ((judgmentCount - weekErrors.length) / judgmentCount * 100) : 100;

    return {
        monday: monday, sunday: sunday,
        onlineCount: onlineCount, physicalCount: physicalCount,
        totalSampling: totalSampling,
        judgmentCount: judgmentCount,  // 判责量（优先Supabase每日同步，降级飞书8pTEgS）
        coverage: coverage,
        accuracy: accuracy,
        cjErrors: cjErrors,
        csErrors: weekErrors.filter(function(e) { return e.source === '初审'; }).length,
        qaErrors: weekErrors.filter(function(e) { return e.source === 'QA'; }).length,
        totalErrors: weekErrors.length,
        activeDays: activeDays,
        dailyAvgEfficiency: dailyAvgEfficiency,
        panZeAccuracy: panZeAccuracy,
        personStats: personStats,
        categoryStats: categoryStats,
        personCount: allPeople,
        sampledCount: sampledPeople,
        droppedPanZeNames: Object.keys(droppedPanZeNames)
    };
}

function computeAllWeeks(errors, sampling, panZe, weekOptions, siteFilter) {
    return weekOptions.map(function(opt) {
        return computeWeekData(errors, sampling, panZe, opt.monday, opt.sunday, siteFilter);
    });
}

function computeTrend(current, previous, sensitive) {
    if (!previous || previous === 0) return { text: '--', cls: 'trend-same', arrow: '→', pct: 0 };
    if (sensitive) {
        // 高精度指标（如准确率）：直接用百分点差值，阈值 0.005pp
        var pp = current - previous;
        if (Math.abs(pp) < 0.005) return { text: '→持平', cls: 'trend-same', arrow: '→', pct: 0 };
        if (pp > 0) return { text: '↑' + Math.abs(pp).toFixed(2) + 'pp', cls: 'trend-up', arrow: '↑', pct: pp };
        return { text: '↓' + Math.abs(pp).toFixed(2) + 'pp', cls: 'trend-down', arrow: '↓', pct: pp };
    }
    var pct = (current - previous) / previous * 100;
    if (Math.abs(pct) < 0.5) return { text: '→持平', cls: 'trend-same', arrow: '→', pct: 0 };
    if (pct > 0) return { text: '↑' + Math.abs(pct).toFixed(2) + '%', cls: 'trend-up', arrow: '↑', pct: pct };
    return { text: '↓' + Math.abs(pct).toFixed(2) + '%', cls: 'trend-down', arrow: '↓', pct: pct };
}

function getLightClass(rate) {
    if (rate <= 10) return 'row-green';
    if (rate <= 20) return 'row-yellow';
    return 'row-red';
}

function getLightTag(rate) {
    if (rate <= 10) return '<span class="tag tag-green">🟢 稳定</span>';
    if (rate <= 20) return '<span class="tag tag-yellow">🟡 关注</span>';
    return '<span class="tag tag-red">🔴 预警</span>';
}

// ==================== 8. UI渲染 ====================
function renderKpiTable(weekData, allWeeks) {
    // 取周期窗口数据（周=4周：选中周+前3周；月=2月：本月+上月）；数据不足的列填空
    var depth = periodDepth();
    var weeks = [];
    for (var w = 0; w < depth; w++) {
        var idx = getCurIndex() + w;
        weeks.push((idx < allWeeks.length && allWeeks[idx]) ? allWeeks[idx] : null);
    }
    // weeks[0]=选中周期, weeks[1]=上一周期, ...（月模式 weeks=[本月,上月] 或 [上月, 无]）

    // 辅助：格式化环比（本周 vs 上周）
    function deltaVal(cur, prev, unit) {
        if (prev === null || prev === undefined) return '--';
        var d = cur - prev;
        if (unit === 'pp') return (d >= 0 ? '+' : '') + d.toFixed(2) + '%';
        if (unit === 'pct') return (d >= 0 ? '+' : '') + d.toFixed(2) + '%';
        return (d >= 0 ? '+' : '') + Math.round(d);
    }

    function deltaColor(cur, prev) {
        if (prev === null || prev === undefined) return '#94a3b8';
        return cur > prev ? '#27ae60' : (cur < prev ? '#c0392b' : '#94a3b8');
    }

    // 取每个指标各周期的值
    function vals(field) { return weeks.map(function(w) { return w ? w[field] : null; }); }

    var rows = [
        { label: '累计抽检台数', unit: 'int', field: 'totalSampling', format: function(v) { return v; }, threshold: null, invert: false },
        { label: '有效抽检天数', unit: 'int', field: 'activeDays', format: function(v) { return v; }, threshold: null, invert: false },
        { label: '抽检日均人效', unit: 'int', field: 'dailyAvgEfficiency', format: function(v) { return v; }, threshold: null, invert: false },
        { label: '站点总判责量', unit: 'int', field: 'judgmentCount', format: function(v) { return v; }, threshold: null, invert: false },
        { label: '实际抽检占比(15%)', unit: 'pct', field: 'coverage', format: function(v) { return v.toFixed(2) + '%'; }, threshold: 15, invert: false },
        { label: '抽检失误数', unit: 'int', field: 'cjErrors', format: function(v) { return v; }, threshold: null, invert: true },
        { label: '抽检准确率(99%)', unit: 'pp', field: 'accuracy', format: function(v) { return v.toFixed(2) + '%'; }, threshold: 99, invert: false },
        { label: '品控失误数', unit: 'int', field: 'totalErrors', format: function(v) { return v; }, threshold: null, invert: true },
        { label: '判责准确率(99.5%)', unit: 'pp', field: 'panZeAccuracy', format: function(v) { return v.toFixed(2) + '%'; }, threshold: 99.5, invert: false }
    ];

    var colCount = weeks.length + 3; // 指标 + 环比 + N周 + 趋势
    var colWidth = (100 / colCount).toFixed(1) + '%';
    var html = '<div class="table-wrap"><table class="data-table" style="font-size:0.8rem;table-layout:fixed;">';
    // 表头
    html += '<thead><tr><th style="width:' + colWidth + ';">指标</th><th style="width:' + colWidth + ';">环比</th>';
    weeks.forEach(function(w, i) {
        var label = w ? periodLabelHtml(w) : '--';
        var dateRange = w ? formatShortDate(w.monday) + '~' + formatShortDate(w.sunday) : '';
        var cellContent = (i === 0 ? '📌 ' : '') + label + '<br><span style="font-weight:400;font-size:0.7rem;color:#5e6f8d;">' + dateRange + '</span>';
        html += '<th style="width:' + colWidth + ';">' + cellContent + '</th>';
    });
    html += '<th style="width:' + colWidth + ';">趋势</th></tr></thead><tbody>';

    // 数据行
    rows.forEach(function(row) {
        var data = vals(row.field);
        var cur = data[0], prev = data[1];
        var dVal = (cur !== null && prev !== null) ? deltaVal(cur, prev, row.unit) : '--';
        var dColor = (cur !== null && prev !== null) ? (row.invert ? deltaColor(prev, cur) : deltaColor(cur, prev)) : '#94a3b8';

        // 迷你趋势图（从旧到新排列）
        var sparkVals = data.slice().reverse(); // 反转：旧→新
        var sparkSVG = buildSparkline(sparkVals, 80, 26);

        html += '<tr>';
        html += '<td style="font-weight:600;">' + row.label + '</td>';
        html += '<td style="color:' + dColor + ';font-weight:600;font-size:0.78rem;">' + dVal + '</td>';
        data.forEach(function(v, i) {
            var colorStyle = '';
            if (row.threshold !== null && v !== null && v < row.threshold) {
                colorStyle = 'color:#c0392b;';
            }
            html += '<td style="font-weight:' + (i === 0 ? '700' : '400') + ';' + colorStyle + '">' + (v !== null ? row.format(v) : '--') + '</td>';
        });
        html += '<td>' + (sparkSVG || '<span class="text-muted">--</span>') + '</td>';
        html += '</tr>';
    });

    html += '</tbody></table></div>';
    document.getElementById('kpiRow').innerHTML = html;
    document.getElementById('kpiRow').style.display = '';
}

function showKpiTrendPopup(type) {
    var allWeeks = window._allWeeksCache || [];
    if (allWeeks.length < 2) return;

    var titles = { sampling: '📦 抽检量', judgment: '⚖️ 判责量', coverage: '📐 抽检覆盖率', accuracy: '🎯 抽检准确率' };
    var title = titles[type] || type;

    // 以选中周为基准，收集至多4周数据（从旧到新排列，选中周在最右）
    var sel = currentWeekIndex;
    var popWeeks = [];
    for (var pw = Math.min(sel + 3, allWeeks.length - 1); pw >= sel; pw--) {
        if (pw < allWeeks.length && allWeeks[pw]) popWeeks.push(allWeeks[pw]);
    }
    // 已按从旧到新排列（高索引=旧周先push），选中周在最后

    var selLabel = allWeeks[sel] ? getWeekLabel(allWeeks[sel].monday) : '';

    // 收集4周卡片（从旧到新显示，选中周在最后=高亮）
    var weekCards = '';
    for (var wc = 0; wc < popWeeks.length; wc++) {
        var wd = popWeeks[wc];
        if (!wd) continue;
        var val, sub;
        switch (type) {
            case 'sampling':
                val = wd.totalSampling;
                sub = '线上:' + wd.onlineCount + '<br>实物:' + wd.physicalCount;
                break;
            case 'judgment':
                val = wd.judgmentCount;
                sub = '判责总量';
                break;
            case 'coverage':
                var covVal = wd.judgmentCount > 0 ? (wd.totalSampling / wd.judgmentCount * 100) : 0;
                val = covVal.toFixed(2) + '%';
                sub = '抽检' + wd.totalSampling + '/判责' + wd.judgmentCount;
                break;
            case 'accuracy':
                val = wd.accuracy.toFixed(2) + '%';
                sub = '失误:' + wd.cjErrors + '单<br>抽检:' + wd.totalSampling + '单';
                break;
        }
        var label = getWeekLabel(wd.monday);
        var isSel = (wc === popWeeks.length - 1);
        weekCards += '<div style="background:' + (isSel ? '#f1f5f9' : '#fafcfd') + ';border:1px solid ' + (isSel ? '#2a5298' : '#eef2f6') + ';padding:14px 16px;border-radius:0;">' +
            '<div style="font-size:0.75rem;color:#5e6f8d;margin-bottom:4px;">' + (isSel ? '📌 ' : '📅 ') + label + '</div>' +
            '<div style="font-size:1.4rem;font-weight:700;color:#1f3a6b;">' + val + '</div>' +
            '<div style="font-size:0.72rem;color:#94a3b8;">' + sub + '</div>' +
            '</div>';
    }

    // 补齐到4列（不足4周时用占位卡）
    var cardCount = (weekCards.match(/<\/div>/g) || []).length;
    while (cardCount < 12) {
        weekCards += '<div style="background:#fafcfd;border:1px dashed #eef2f6;padding:14px 16px;border-radius:0;display:flex;align-items:center;justify-content:center;"><span class="text-muted" style="font-size:0.75rem;">无数据</span></div>';
        cardCount += 3;
    }

    // 收集趋势数据（从旧到新，用于折线图）
    var labels = [], values = [], weekLabels = [];
    for (var wv = 0; wv < popWeeks.length; wv++) {
        var wd2 = popWeeks[wv];
        if (!wd2) continue;
        weekLabels.push(getWeekLabel(wd2.monday));
        var v2;
        switch (type) {
            case 'sampling': v2 = wd2.totalSampling; break;
            case 'judgment': v2 = wd2.judgmentCount; break;
            case 'coverage': v2 = wd2.judgmentCount > 0 ? (wd2.totalSampling / wd2.judgmentCount * 100) : 0; break;
            case 'accuracy': v2 = wd2.accuracy; break;
        }
        labels.push((type === 'coverage' || type === 'accuracy') ? v2.toFixed(2) + '%' : String(v2));
        values.push(v2);
    }

    // 构建带标签的SVG趋势图
    var chartW = 500, chartH = 140, padL = 50, padR = 20, padT = 24, padB = 34;
    var plotW = chartW - padL - padR, plotH = chartH - padT - padB;
    var validVals = values.filter(function(v3) { return v3 !== null && v3 !== undefined; });
    var minV = validVals.length > 0 ? Math.min.apply(null, validVals) : 0;
    var maxV = validVals.length > 0 ? Math.max.apply(null, validVals) : 1;
    var range = maxV - minV || 1;
    var n = values.length;

    var points = [], svgCircles = '', svgLabels = '', svgXLabels = '';
    for (var pi = 0; pi < n; pi++) {
        if (values[pi] === null || values[pi] === undefined) continue;
        var cx = padL + (n > 1 ? (pi / (n - 1)) * plotW : plotW / 2);
        var cy = padT + (1 - (values[pi] - minV) / range) * plotH;
        points.push(cx.toFixed(1) + ',' + cy.toFixed(1));
        var isLast = (pi === n - 1);
        svgCircles += '<circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="' + (isLast ? '5' : '4') + '" fill="' + (isLast ? '#1f3a6b' : '#2a5298') + '" stroke="white" stroke-width="2"/>';
        svgLabels += '<text x="' + cx.toFixed(1) + '" y="' + (cy - 10).toFixed(1) + '" text-anchor="middle" font-size="11" fill="#1f3a6b" font-weight="600">' + labels[pi] + '</text>';
        svgXLabels += '<text x="' + cx.toFixed(1) + '" y="' + (chartH - 6).toFixed(0) + '" text-anchor="middle" font-size="10" fill="#5e6f8d">' + weekLabels[pi] + '</text>';
    }

    var trendSVG2 = points.length >= 2 ?
        '<svg viewBox="0 0 ' + chartW + ' ' + chartH + '" style="display:block;width:100%;max-width:500px;height:auto;margin:0 auto;">' +
            '<line x1="' + padL + '" y1="' + padT + '" x2="' + padL + '" y2="' + (padT + plotH) + '" stroke="#eef2f6" stroke-width="1"/>' +
            '<line x1="' + padL + '" y1="' + (padT + plotH) + '" x2="' + (padL + plotW) + '" y2="' + (padT + plotH) + '" stroke="#eef2f6" stroke-width="1"/>' +
            '<polyline points="' + points.join(' ') + '" fill="none" stroke="#2a5298" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' +
            svgCircles + svgLabels + svgXLabels +
        '</svg>' : '';

    var trendIconBig = getTrendIcon(values);

    var overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = '<div class="modal-container" style="max-width:620px;">' +
        '<div class="modal-header">' + title + ' 趋势（📌 ' + selLabel + '）<button class="modal-close-btn" id="kpiClose">✕</button></div>' +
        '<div class="modal-body">' +
            '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;">' + weekCards + '</div>' +
            '<div style="text-align:center;padding:10px 0;">' +
                '<div style="font-weight:600;margin-bottom:6px;color:#1f3a6b;">📈 近4周趋势（折线右端 = 选中周）</div>' +
                (trendSVG2 || '<span class="text-muted">数据不足</span>') +
                '<div style="margin-top:4px;font-size:1.3rem;">' + trendIconBig + '</div>' +
            '</div>' +
        '</div>' +
    '</div>';
    document.body.appendChild(overlay);
    overlay.querySelector('#kpiClose').onclick = function() { overlay.remove(); };
    overlay.onclick = function(e) { if (e.target === overlay) overlay.remove(); };
}

function sortPersonStats(stats, col, asc) {
    return stats.slice().sort(function(a, b) {
        var va, vb;
        switch (col) {
            case 'name': va = a.name; vb = b.name; break;
            case 'sampling': va = a.sampling; vb = b.sampling; break;
            case 'panZe': va = a.panZe; vb = b.panZe; break;
            case 'coverage': va = a.coverage; vb = b.coverage; break;
            case 'errors': va = a.errors; vb = b.errors; break;
            case 'samplingAccuracy': va = a.samplingAccuracy; vb = b.samplingAccuracy; break;
            case 'accuracy': va = a.accuracy; vb = b.accuracy; break;
            case 'totalErrors': va = a.totalErrors; vb = b.totalErrors; break;
            case 'rate':
            default: va = a.rate; vb = b.rate; break;
        }
        if (va === null || va === undefined) return 1;   // null 永远排最后
        if (vb === null || vb === undefined) return -1;
        if (typeof va === 'string') return asc ? va.localeCompare(vb) : vb.localeCompare(va);
        return asc ? va - vb : vb - va;
    });
}

function buildSparkline(values, width, height) {
    // values: [v0, v1, v2, v3] 从最早到最新（v3=当前周）
    if (!values || values.length < 2) return '';
    var valid = values.filter(function(v) { return v !== null && v !== undefined && isFinite(v); });
    if (valid.length < 2) return '';
    var min = Math.min.apply(null, valid); var max = Math.max.apply(null, valid);
    var range = max - min || 1;
    var pad = 2;
    var w = width - pad * 2; var h = height - pad * 2;
    // 反转：SVG y=0在顶部，准确率越高y越小
    var points = values.map(function(v, idx) {
        var x = pad + (idx / (values.length - 1)) * w;
        if (v === null || v === undefined || !isFinite(v)) return { x: x, y: null };  // 缺数据周：保留x位置画空心点
        var y = pad + (1 - (v - min) / range) * h;
        return { x: x, y: y };
    });
    var validPoints = points.filter(function(p) { return p.y !== null; });
    if (validPoints.length < 2) return '';
    var polyline = '<polyline points="' + validPoints.map(function(p) { return p.x.toFixed(1) + ',' + p.y.toFixed(1); }).join(' ') + '" fill="none" stroke="#2a5298" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>';
    var dots = '';
    points.forEach(function(p) {
        if (p.y === null) {
            dots += '<circle cx="' + p.x.toFixed(1) + '" cy="' + (h / 2).toFixed(1) + '" r="2" fill="none" stroke="#cbd5e1" stroke-width="1"/>';  // 灰色空心点=该周无数据
        } else {
            dots += '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="2" fill="#2a5298"/>';
        }
    });
    return '<svg width="' + width + '" height="' + height + '" style="vertical-align:middle;">' + polyline + dots + '</svg>';
}

function getTrendIcon(accHistory) {
    // accHistory: [w0, w1, w2, w3] w0=最远, w3=当前
    if (!accHistory || accHistory.length < 2) return '<span class="text-muted">--</span>';
    var valid = accHistory.filter(function(v) { return v !== null; });
    if (valid.length < 2) return '<span class="text-muted">--</span>';
    // 直接对比最近两周：当前 vs 上周
    var current = valid[valid.length - 1];
    var previous = valid[valid.length - 2];
    var delta = current - previous;
    if (Math.abs(delta) < 0.01) return '<span style="color:#2980b9;font-size:1.1rem;">→</span>';
    if (delta > 0) return '<span style="color:#27ae60;font-size:1.1rem;">↑</span>';
    return '<span style="color:#c0392b;font-size:1.1rem;">↓</span>';
}

function renderPersonTable(weekData, allWeeks) {
    // 缓存全部周数据供弹窗使用
    window._allWeeksCache = allWeeks;

    var stats = sortPersonStats(weekData.personStats, personSortCol, personSortAsc);

    // 构建每人最近周期准确率历史（以选定周期为基准往前取，周=4、月=2；索引0=最远, 索引N-1=选定周期，没数据的周期填null占位）
    var accHistoryMap = {};
    var maxWeeks = Math.min(allWeeks.length - getCurIndex(), periodDepth());
    stats.forEach(function(p) { accHistoryMap[p.name] = new Array(maxWeeks).fill(null); });
    for (var wi = maxWeeks - 1; wi >= 0; wi--) {
        var wd = allWeeks[getCurIndex() + wi];
        if (!wd || !wd.personStats) continue;
        var idx = maxWeeks - 1 - wi; // 选定周期=最后一个位置
        wd.personStats.forEach(function(ps) {
            if (accHistoryMap[ps.name] !== undefined) {
                accHistoryMap[ps.name][idx] = ps.accuracy;
            }
        });
    }

    var tbody = '';

    // === 总计行（置于表格顶部）===
    var totalSamplingAll = 0, totalPanZeAll = 0, totalErrorsAll = 0, totalAllErrors = 0;
    stats.forEach(function(p) { totalSamplingAll += p.sampling; totalPanZeAll += (p.panZe || 0); totalErrorsAll += p.errors; totalAllErrors += (p.totalErrors || 0); });
    var totalCoverageAll = totalPanZeAll > 0 ? (totalSamplingAll / totalPanZeAll * 100) : 0;
    var totalAccuracyAll = totalPanZeAll > 0 ? Math.max(0, (totalPanZeAll - totalAllErrors) / totalPanZeAll * 100) : null;
    var totalSampleAccAll = totalSamplingAll > 0 ? Math.max(0, (totalSamplingAll - totalErrorsAll) / totalSamplingAll * 100) : null; // 抽检准确率总计口径

    // === 总计行环比小字（2026-09-07 用户需求：总计行每个数值格下方标注较上一周期升降值）===
    // 基准=选中周期的上一周期（allWeeks[getCurIndex()+1]，与表头上一列同周期）；口径与本周总计行一致（personStats 求和）
    var prevTotalRef = null;
    var prevTotWd = (getCurIndex() + 1 < allWeeks.length) ? allWeeks[getCurIndex() + 1] : null;
    if (prevTotWd && prevTotWd.personStats) {
        var ts0 = 0, tp0 = 0, te0 = 0, tte0 = 0;
        prevTotWd.personStats.forEach(function(ps) { ts0 += (ps.sampling || 0); tp0 += (ps.panZe || 0); te0 += (ps.errors || 0); tte0 += (ps.totalErrors || 0); });
        prevTotalRef = {
            sampling: ts0, panZe: tp0, errors: te0, totalErrors: tte0,
            coverage: tp0 > 0 ? (ts0 / tp0 * 100) : 0,
            sampleAcc: ts0 > 0 ? Math.max(0, (ts0 - te0) / ts0 * 100) : null,
            acc: tp0 > 0 ? Math.max(0, (tp0 - tte0) / tp0 * 100) : null
        };
    }
    // invert=true 表示该类指标「数值下降=改善」（失误类）→ 红=数值上升、绿=数值下降
    function totDeltaHtml(cur, prev, invert, isPct, suffix) {
        if (prev === null || prev === undefined || cur === null || cur === undefined) return '';
        var d = cur - prev;
        var isZero = isPct ? Math.abs(d) < 0.005 : d === 0;
        var good = isZero ? false : (invert ? d < 0 : d > 0);
        var col = isZero ? '#94a3b8' : (good ? '#27ae60' : '#c0392b');
        var arrow = isZero ? '→' : (d > 0 ? '▲' : '▼');
        var numTxt = isPct ? Math.abs(d).toFixed(2) + '%' : Math.abs(d) + (suffix || '');
        return '<div style="font-size:0.58rem;font-weight:400;color:' + col + ';margin-top:2px;white-space:nowrap;">' + arrow + (isZero ? '持平' : numTxt) + '</div>';
    }

    // 计算总计的跨周期趋势（判责准确率口径，选定周期起往前取）
    var totalAccHistory = [];
    for (var tw = maxWeeks - 1; tw >= 0; tw--) {
        var twd = allWeeks[getCurIndex() + tw];
        if (!twd || !twd.personStats) continue;
        var twPanZe = 0, twTotalErrors = 0;
        twd.personStats.forEach(function(ps) { twPanZe += (ps.panZe || 0); twTotalErrors += (ps.totalErrors || 0); });
        totalAccHistory.push(twPanZe > 0 ? Math.max(0, (twPanZe - twTotalErrors) / twPanZe * 100) : null);
    }
    var totalSpark = buildSparkline(totalAccHistory, 88, 22);
    var totalTrendIcon = getTrendIcon(totalAccHistory);

    var totalAccTxt = totalAccuracyAll === null ? "--" : totalAccuracyAll.toFixed(2) + "%";
    var totalAccColor = totalAccuracyAll === null ? "#94a3b8" : (totalAccuracyAll >= 99.5 ? "#27ae60" : (totalAccuracyAll < 99 ? "#c0392b" : "#f39c12"));

    tbody += "<tr style=\"background:#f1f5f9;font-weight:700;border-bottom:3px solid #2a5298;cursor:pointer;\" onclick=\"showTotalTrendPopup()\" title=\"点击查看整体趋势\">" +
        "<td style=\"text-align:center;\">📊</td>" +
        "<td class=\"col-name\" style=\"font-weight:700;\">总计 <span style=\"font-weight:400;color:#5e6f8d;\">(" + stats.length + "人)</span></td>" +
        "<td style=\"text-align:center;\">--</td>" +
        "<td class=\"col-num\">" + totalSamplingAll + totDeltaHtml(totalSamplingAll, prevTotalRef ? prevTotalRef.sampling : null, false, false, "台") + "</td>" +
        "<td class=\"col-num\">" + totalPanZeAll + totDeltaHtml(totalPanZeAll, prevTotalRef ? prevTotalRef.panZe : null, false, false, "台") + "</td>" +
        "<td class=\"col-num\">" + (totalPanZeAll > 0 ? totalCoverageAll.toFixed(2) + "%" : "--") + totDeltaHtml(totalPanZeAll > 0 ? totalCoverageAll : null, prevTotalRef ? prevTotalRef.coverage : null, false, true, "") + "</td>" +
        "<td class=\"col-num\">" + totalErrorsAll + totDeltaHtml(totalErrorsAll, prevTotalRef ? prevTotalRef.errors : null, true, false, "条") + "</td>" +
        "<td class=\"col-num fw-600\" style=\"color:" + (totalSampleAccAll === null ? "#94a3b8" : (totalSampleAccAll >= 99.5 ? "#27ae60" : (totalSampleAccAll < 99 ? "#c0392b" : "#f39c12"))) + "\">" + (totalSampleAccAll === null ? "--" : totalSampleAccAll.toFixed(2) + "%") + totDeltaHtml(totalSampleAccAll, prevTotalRef ? prevTotalRef.sampleAcc : null, false, true, "") + "</td>" +
        "<td class=\"col-num fw-600\">" + totalAllErrors + totDeltaHtml(totalAllErrors, prevTotalRef ? prevTotalRef.totalErrors : null, true, false, "条") + "</td>" +
        "<td class=\"col-num fw-600\" style=\"color:" + totalAccColor + "\">" + totalAccTxt + totDeltaHtml(totalAccuracyAll, prevTotalRef ? prevTotalRef.acc : null, false, true, "") + "</td>" +
        "<td class=\"col-num\">" + (totalSpark || "<span class=\"text-muted\">--</span>") + "</td>" +
        "<td class=\"text-center\">" + totalTrendIcon + "</td>" +
        "</tr>";

    stats.forEach(function(p, i) {
        var accHistory = accHistoryMap[p.name] || [];
        var sparklineHTML = buildSparkline(accHistory, 88, 22);
        var trendIcon = getTrendIcon(accHistory);

        var siteClass = '';
        if (p.site === '深圳') siteClass = 'sz';
        else if (p.site === '青岛') siteClass = 'qd';
        else if (p.site === '成都') siteClass = 'cd';

        // 判责准确率红绿黄灯：<99%红灯, 99.00-99.49%黄灯, ≥99.50%绿灯；无判责量→灰'--'
        var accTxt, accColor, lightTag;
        if (p.accuracy === null || p.accuracy === undefined) {
            accTxt = '--'; accColor = '#94a3b8'; lightTag = '';
        } else if (p.accuracy < 99) {
            accTxt = p.accuracy.toFixed(2) + '%'; accColor = '#c0392b'; lightTag = '<span class="tag tag-red">🔴</span>';
        } else if (p.accuracy < 99.5) {
            accTxt = p.accuracy.toFixed(2) + '%'; accColor = '#f39c12'; lightTag = '<span class="tag tag-yellow">🟡</span>';
        } else {
            accTxt = p.accuracy.toFixed(2) + '%'; accColor = '#27ae60'; lightTag = '<span class="tag tag-green">🟢</span>';
        }
        // 抽检准确率=(抽检量-抽检失误)/抽检量：<99%红 99-99.49%黄 ≥99.5%绿；无抽检量→灰'--'（行底色灯仍随判责准确率）
        var sampAccTxt, sampAccColor;
        if (p.samplingAccuracy === null || p.samplingAccuracy === undefined) {
            sampAccTxt = '--'; sampAccColor = '#94a3b8';
        } else if (p.samplingAccuracy < 99) {
            sampAccTxt = p.samplingAccuracy.toFixed(2) + '%'; sampAccColor = '#c0392b';
        } else if (p.samplingAccuracy < 99.5) {
            sampAccTxt = p.samplingAccuracy.toFixed(2) + '%'; sampAccColor = '#f39c12';
        } else {
            sampAccTxt = p.samplingAccuracy.toFixed(2) + '%'; sampAccColor = '#27ae60';
        }
        var lightClass = (p.accuracy === null || p.accuracy === undefined) ? '' : (p.accuracy < 99 ? 'row-red' : (p.accuracy < 99.5 ? 'row-yellow' : 'row-green'));

        tbody += '<tr class="' + lightClass + '">' +
            '<td>' + (i + 1) + '</td>' +
            '<td class="col-name"><span class="clickable" onclick="showPersonDetail(\'' + p.name.replace(/'/g, "\\'") + '\')">' + p.name + '</span></td>' +
            '<td>' + (p.site ? '<span class="site-tag ' + siteClass + '">' + p.site + '</span>' : '--') + '</td>' +
            '<td class="col-num fw-600">' + p.sampling + '</td>' +
            '<td class="col-num fw-600">' + (p.panZe || 0) + '</td>' +
            '<td class="col-num">' + (p.panZe > 0 ? p.coverage.toFixed(2) + '%' : '--') + '</td>' +
            '<td class="col-num">' + p.errors + '</td>' +
            '<td class="col-num fw-600" style="color:' + sampAccColor + '">' + sampAccTxt + '</td>' +
            '<td class="col-num fw-600">' + (p.totalErrors || 0) + '</td>' +
            '<td class="col-num fw-600" style="color:' + accColor + '">' + accTxt + ' ' + lightTag + '</td>' +
            '<td class="col-num" style="cursor:pointer;" onclick="showPersonDetail(\'' + p.name.replace(/'/g, "\\'") + '\')" title="点击查看' + p.name + (viewUnit === 'month' ? '近几月' : '近几周') + '趋势">' + (sparklineHTML || '<span class="text-muted">--</span>') + '</td>' +
            '<td class="text-center">' + trendIcon + '</td>' +
            '</tr>';
    });

    document.getElementById('personTbody').innerHTML = tbody;
    var droppedNames = weekData.droppedPanZeNames || [];
    document.getElementById('personMeta').textContent = '共 ' + stats.length + ' 人 | 抽检覆盖 ' + weekData.sampledCount + ' 人 | 失误 ' + weekData.personStats.filter(function(p) { return p.errors > 0; }).length + ' 人 | 判责合计 ' + weekData.judgmentCount + ' 单' + (droppedNames.length > 0 ? ' | ⚠️ 无站点归属未计入判责: ' + droppedNames.join('、') : '');

    // 更新排序箭头
    document.querySelectorAll('#personTable .sortable .sort-arrow').forEach(function(el) { el.textContent = ''; });
    var activeTh = document.querySelector('#personTable .sortable[data-sort="' + personSortCol + '"] .sort-arrow');
    if (activeTh) activeTh.textContent = personSortAsc ? '▲' : '▼';
}
