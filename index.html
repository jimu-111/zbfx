function screenshotSection(elementId, label) {
    var el = document.getElementById(elementId);
    if (!el) { alert("未找到截图元素"); return; }
    if (typeof html2canvas === "undefined") { alert("html2canvas 未加载，请刷新后重试"); return; }

    // 截图前把 textarea 替换为 pre，保留换行
    var swaps = [];
    var textareas = el.querySelectorAll('textarea');
    textareas.forEach(function(ta) {
        var pre = document.createElement('pre');
        pre.textContent = ta.value || ta.placeholder || '';
        pre.style.cssText = 'width:100%;min-height:72px;padding:8px 10px;border:1px solid #cbd5e1;border-radius:6px;font-size:0.78rem;font-family:inherit;white-space:pre-wrap;word-wrap:break-word;margin:0;background:#fff;';
        ta.parentNode.insertBefore(pre, ta);
        ta.style.display = 'none';
        swaps.push({ textarea: ta, pre: pre });
    });

    html2canvas(el, {
        backgroundColor: "#f5f7fa",
        scale: 2,
        useCORS: true,
        logging: false
    }).then(function(canvas) {
        // 恢复 textarea
        swaps.forEach(function(s) { s.pre.remove(); s.textarea.style.display = ''; });
        var link = document.createElement("a");
        var now = new Date();
        var ts = now.getFullYear() + "-" + String(now.getMonth()+1).padStart(2,"0") + "-" + String(now.getDate()).padStart(2,"0") + "_" + String(now.getHours()).padStart(2,"0") + String(now.getMinutes()).padStart(2,"0");
        link.download = label + "_" + ts + ".png";
        link.href = canvas.toDataURL("image/png");
        link.click();
    }).catch(function(err) {
        // 恢复 textarea
        swaps.forEach(function(s) { s.pre.remove(); s.textarea.style.display = ''; });
        console.error("截图失败:", err);
        alert("截图失败: " + err.message);
    });
}

// ==================== 7b. 周报文本自动生成 ====================
function generateReportText(weekData, allWeeks) {
    var prevWeekData = (currentWeekIndex + 1 < allWeeks.length) ? allWeeks[currentWeekIndex + 1] : null;
    var lines = [];
    lines.push('核心指标');

    // 抽检量（括号内：选定站点、当前周期的全部抽检人按出现次数计数，即线上+实物表G列）
    var personSamplingCount = {};
    samplingData.online.concat(samplingData.physical).forEach(function(s) {
        if (!isInWeek(s.date, weekData.monday, weekData.sunday)) return;
        if (!siteMatch(s, currentSite)) return;
        var nm = fixPanZeName(s.sampler);
        if (!nm) return;
        personSamplingCount[nm] = (personSamplingCount[nm] || 0) + 1;
    });
    var personList = Object.keys(personSamplingCount).map(function(n) { return { name: n, sampling: personSamplingCount[n] }; })
        .sort(function(a, b) { return b.sampling - a.sampling; });
    var topStr = personList.length > 0 ? '  （' + personList.map(function(p) { return p.name + '：' + p.sampling; }).join('  ') + '）' : '';
    var samplingDiff = '';
    if (prevWeekData) {
        var ds = weekData.totalSampling - prevWeekData.totalSampling;
        if (ds > 0) samplingDiff = ' 较上周上升' + ds + '台';
        else if (ds < 0) samplingDiff = ' 较上周下降' + (-ds) + '台';
        else samplingDiff = ' 与上周持平';
    }
    lines.push('1、抽检量：' + weekData.totalSampling + topStr + samplingDiff);
    lines.push('  线上：' + weekData.onlineCount + '  实物：' + weekData.physicalCount);
    lines.push('  抽检人效：' + weekData.totalSampling + '/7≈' + Math.round(weekData.totalSampling / 7));

    // 判责量
    var jzDiff = '';
    if (prevWeekData) {
        var dj = weekData.judgmentCount - prevWeekData.judgmentCount;
        if (dj > 0) jzDiff = '，较上周上升' + dj + '台';
        else if (dj < 0) jzDiff = '，较上周下降' + (-dj) + '台';
        else jzDiff = '，与上周持平';
    }
    lines.push('2、判责量：' + weekData.judgmentCount + jzDiff);

    // 抽检覆盖率
    var covDiff = '';
    if (prevWeekData) {
        var dc = weekData.coverage - prevWeekData.coverage;
        if (dc > 0) covDiff = '，较上周提升' + dc.toFixed(2) + '%';
        else if (dc < 0) covDiff = '，较上周下降' + (-dc).toFixed(2) + '%';
        else covDiff = '，与上周持平';
    }
    lines.push('3、抽检覆盖率：' + weekData.coverage.toFixed(2) + '%' + covDiff);

    // 抽检准确率
    var accDiff = '';
    if (prevWeekData) {
        var da = weekData.accuracy - prevWeekData.accuracy;
        if (da > 0) accDiff = '，较上周提升' + da.toFixed(2) + '%';
        else if (da < 0) accDiff = '，较上周下降' + (-da).toFixed(2) + '%';
        else accDiff = '，与上周持平';
    }
    lines.push('4、抽检准确率：' + weekData.accuracy.toFixed(2) + '%' + accDiff);

    // 前三周环比（只看本周vs上周的抽检量）
    var trendTxt = '数据不足';
    if (prevWeekData) {
        var dt = weekData.totalSampling - prevWeekData.totalSampling;
        if (dt < 0) trendTxt = '呈下降趋势';
        else if (dt > 0) trendTxt = '呈上升趋势';
        else trendTxt = '整体平稳';
    }
    lines.push('5、前三周环比：' + trendTxt);

    return lines.join('\n');
}

function updateReportText(weekData, allWeeks) {
    var ta = document.getElementById('reportText');
    if (!ta) return;
    ta.value = generateReportText(weekData, allWeeks);
    document.getElementById('reportSection').style.display = '';
}

function copyReportText() {
    var ta = document.getElementById('reportText');
    var btn = document.getElementById('btnCopyReport');
    if (!ta || !btn) return;
    var done = function(ok) {
        var old = btn.innerHTML;
        btn.innerHTML = ok ? '✅ 已复制' : '❌ 复制失败';
        setTimeout(function() { btn.innerHTML = old; }, 1500);
    };
    ta.focus();
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch(e) { ok = false; }
    if (ok) { done(true); return; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(ta.value).then(function() { done(true); }, function() { done(false); });
    } else {
        done(false);
    }
}

function renderAll(weekData, allWeeks) {
    // 环比对比：选中周的上一周（而非总是本周的"上周"）
    var prevWeekData = (currentWeekIndex + 1 < allWeeks.length) ? allWeeks[currentWeekIndex + 1] : null;

// ==================== 9. 交互 ====================
function switchWeek(index) {
    if (index < 0 || index >= weekOptions.length) return;
    currentWeekIndex = index;
    document.getElementById('weekSelect').value = index;
    document.getElementById('btnPrevWeek').disabled = (index >= weekOptions.length - 1);
    document.getElementById('btnNextWeek').disabled = (index <= 0);
    refreshView();
}

function refreshView() {
    if (!dataReady) return;
    var weeks = computeAllWeeks(allErrors, samplingData, panZeRecords, weekOptions, currentSite);
    var weekData = weeks[currentWeekIndex];
    renderAll(weekData, weeks);
    updateErrorTabs(weekData);

    document.querySelectorAll('#siteFilter .site-filter-btn').forEach(function(btn) {
        btn.classList.remove('active', 'sz-active', 'qd-active', 'cd-active');

            else if (currentSite === '青岛') btn.classList.add('qd-active');
            else if (currentSite === '成都') btn.classList.add('cd-active');
        }
    });
}

                '<td><span class="source-tag ' + srcTag + '">' + e.source + '</span></td>' +
                '<td>' + e.category + '</td>' +
                '<td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="' + (e.note || '') + '">' + (e.note || '--') + '</td>' +
                '<td>' + (e.qcCode || '--') + '</td>' +
                '</tr>';
        });
        html += '</tbody></table></div>';
    } else {
        html += '<div class="text-muted text-sm" style="text-align:center;padding:20px;">本周无失误记录 ✅</div>';
    }

    // 最近3周数据对比
    var allWeeks = window._allWeeksCache || [];
    var weekHistory = [];
    for (var wi2 = 0; wi2 < Math.min(allWeeks.length, 4); wi2++) {
        var wd2 = allWeeks[wi2];
        if (!wd2 || !wd2.personStats) continue;
        var wp = null;
        wd2.personStats.forEach(function(ps) { if (ps.name === name) wp = ps; });
        weekHistory.push({
            label: getWeekLabel(wd2.monday),
            sampling: wp ? wp.sampling : 0,
            panZe: wp ? (wp.panZe || 0) : 0,
            errors: wp ? wp.errors : 0,
            accuracy: wp ? wp.accuracy : null,
            coverage: wp ? (wp.panZe > 0 ? wp.coverage : 0) : 0
        });
    }
    if (weekHistory.length > 1) {
        html += '<div style="margin-top:16px;">' +
            '<div style="font-weight:600;margin-bottom:10px;color:#1f3a6b;">📈 最近3周趋势</div>' +
            '<div class="table-wrap"><table class="data-table"><thead><tr>' +
            '<th>周期</th><th>抽检量</th><th>判责量</th><th>失误</th><th>覆盖率</th><th>准确率</th>' +
            '</tr></thead><tbody>';
        weekHistory.forEach(function(wh) {
            var ac = wh.accuracy !== null ? wh.accuracy.toFixed(2) + '%' : '--';
            var acColor = wh.accuracy !== null ? (wh.accuracy >= 99.95 ? 'color:#27ae60' : wh.accuracy <= 99.5 ? 'color:#c0392b' : 'color:#f39c12') : '';
            html += '<tr>' +
                '<td style="font-weight:600;">' + wh.label + '</td>' +
                '<td>' + wh.sampling + '</td>' +
                '<td>' + wh.panZe + '</td>' +
                '<td>' + wh.errors + '</td>' +
                '<td>' + (wh.panZe > 0 ? wh.coverage.toFixed(2) + '%' : '--') + '</td>' +
                '<td style="font-weight:600;' + acColor + '">' + ac + '</td>' +
                '</tr>';
        });
        html += '</tbody></table></div></div>';
    }
    html += '</div>';

    var overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = '<div class="modal-container" style="max-width:750px;">' + html + '</div>';
    document.body.appendChild(overlay);
    overlay.querySelector('#detailClose').onclick = function() { overlay.remove(); };
    overlay.onclick = function(e) { if (e.target === overlay) overlay.remove(); };
}

function setupEventListeners() {
    // 周切换
    document.getElementById('btnPrevWeek').onclick = function() { switchWeek(currentWeekIndex + 1); };
    document.getElementById('btnNextWeek').onclick = function() { switchWeek(currentWeekIndex - 1); };
    document.getElementById('weekSelect').onchange = function() { switchWeek(parseInt(this.value)); };

    // 站点筛选
    document.querySelectorAll('#siteFilter .site-filter-btn').forEach(function(btn) {
        btn.onclick = function() {
            currentSite = this.dataset.site;
            refreshView();
        };
    });

    // 复制周报文本
    document.getElementById('btnCopyReport').onclick = copyReportText;

    // 刷新
    document.getElementById('btnRefresh').onclick = async function() {
        document.getElementById('loadingArea').style.display = '';
        document.getElementById('personSection').style.display = 'none';
        document.getElementById('errorSection').style.display = 'none';
        await initData();
    };

    // 表格排序
    document.querySelectorAll('#personTable .sortable').forEach(function(th) {
        th.onclick = function() {
            var col = this.dataset.sort;
            if (personSortCol === col) {
                personSortAsc = !personSortAsc;
            } else {
                personSortCol = col;
                personSortAsc = (col === 'name');
            }
            refreshView();
        };
    });

    // Tab切换
    document.querySelectorAll('#errorTabs .tab-btn').forEach(function(btn) {
        btn.onclick = function() {
            document.querySelectorAll('#errorTabs .tab-btn').forEach(function(b) { b.classList.remove('active'); });
            this.classList.add('active');
            activeErrorTab = this.dataset.tab;
            refreshView();
        };
    });

    // visibilitychange 自动刷新
    document.addEventListener('visibilitychange', function() {
        if (!document.hidden && dataReady) {
            initData(true);
        }
    });
}

// ==================== 10. 初始化 ====================
async function initData(silent) {
    if (!silent) {
        document.getElementById('loadingArea').style.display = '';
        document.getElementById('bannerArea').innerHTML = '';
        document.getElementById('personSection').style.display = 'none';
        document.getElementById('errorSection').style.display = 'none';
    }

    var token = await acquireToken();
    if (!token) {
        document.getElementById('loadingArea').style.display = 'none';
        showAuthUI();
        return;
    }

    try {
        // 第一批：最近2周（行数减半），先渲染让界面尽快显示
        var results1 = await fetchAllData(token, 'first2');
        applyLoadedData(results1);

        // 第二批：第3~5周，后台补充完成后自动刷新界面
        if (!silent) {
            document.getElementById('bannerArea').innerHTML =
                '<div class="info-banner">⏳ 已加载最近两周，正在后台加载第3~5周…</div>';
        }
        try {
            var results2 = await fetchAllData(token, 'rest2');
            var merged = mergePhaseResults(results1, results2);
            applyLoadedData(merged);
        } catch(e) {
            console.warn('[二批] 第3~5周加载失败，保持最近2周数据:', e.message);
            if (!silent) {
                document.getElementById('bannerArea').innerHTML = '';
            }
        }
    } catch(e) {
        document.getElementById('loadingArea').style.display = 'none';
        document.getElementById('bannerArea').innerHTML =
            '<div class="error-banner"><div><span class="error-title">❌ 数据加载异常</span> — ' + e.message + '</div><button class="btn btn-sm" onclick="initData()">🔄 重试</button></div>';
    }
}

// 应用已拉取结果：解析、更新全局数据并渲染界面（首批/合并后各调一次）
function applyLoadedData(results) {
    var processed = processResults(results);

    // 检查是否全部失败
    var allFailed = results.every(function(r) { return !r.ok; });
    if (allFailed && processed.errors.length === 0) {
        document.getElementById('loadingArea').style.display = 'none';
        document.getElementById('bannerArea').innerHTML =
            '<div class="error-banner"><div><span class="error-title">⚠️ 数据加载失败</span> — 所有Sheet均无法读取，可能是授权过期</div><button class="btn btn-sm" onclick="initData()">🔄 重试</button></div>';
        if (allErrors.length === 0) showAuthUI();
        return;
    }

    allErrors = processed.errors;
    samplingData = processed.sampling;
    weekOptions = buildWeekOptions();
    // 保持当前周选择，不强制跳回本周
    if (currentWeekIndex >= weekOptions.length) currentWeekIndex = 0;
    dataReady = true;

    // 填充周选择器
    var selectHTML = '';
    weekOptions.forEach(function(opt, i) {
        selectHTML += '<option value="' + i + '"' + (i === currentWeekIndex ? ' selected' : '') + '>' + (opt.isCurrent ? '📌 ' : '📅 ') + opt.label + '</option>';
    });
    document.getElementById('weekSelect').innerHTML = selectHTML;
    document.getElementById('btnPrevWeek').disabled = (currentWeekIndex >= weekOptions.length - 1);
    document.getElementById('btnNextWeek').disabled = (currentWeekIndex <= 0);

    document.getElementById('loadingArea').style.display = 'none';
    document.getElementById('bannerArea').innerHTML = '';

    // 显示各Sheet加载状态
    var statusParts = [];
    FEISHU_CONFIG.sheets.forEach(function(sh) {
        var s = processed.status[sh.name];
        if (s && s.ok) statusParts.push(sh.source + ':' + s.count + '条 ✅');
        else statusParts.push(sh.source + ':加载失败 ❌');
    });
    FEISHU_CONFIG.samplingSheets.forEach(function(sh) {
        var s = processed.status[sh.name];
        if (s && s.ok) statusParts.push(sh.name + ':' + s.count + '条 ✅');
        else statusParts.push(sh.name + ':加载失败 ❌');
    });
    // Supabase判责量
    var pzSupabaseStatus = processed.status['Supabase判责量'];
    if (pzSupabaseStatus && pzSupabaseStatus.ok) statusParts.push('判责(Supabase):' + pzSupabaseStatus.count + '人 ✅');
    else statusParts.push('判责(Supabase):加载失败 ⚠️');

    refreshView();
}

// ==================== 11. 启动 ====================
setupEventListeners();

// 检查URL参数是否有授权码
var urlParams = new URLSearchParams(window.location.search);
var codeFromUrl = urlParams.get('code');
if (codeFromUrl) {
    document.getElementById('loadingArea').style.display = '';
    exchangeCodeForToken(codeFromUrl).then(function(r) {
        if (r.success) {
            // 清除URL参数
            if (window.history && window.history.replaceState) {
                window.history.replaceState({}, document.title, window.location.pathname);
            }
            initData();
        } else {
            document.getElementById('loadingArea').style.display = 'none';
            document.getElementById('bannerArea').innerHTML =
                '<div class="error-banner"><div><span class="error-title">❌ 授权激活失败</span> — ' + r.error + '</div></div>';
            showAuthUI();
        }
    });
} else {
    initData();
}
</script>
