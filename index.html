<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>品控周报分析</title>
<style>
/* ========== 全局重置 ========== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #f5f7fa; color: #1f3a6b; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
}

/* ========== 变量 ========== */
:root {
    --primary: #1f3a6b; --primary-light: #2a5298;
    --success: #27ae60; --warning: #f39c12; --danger: #c0392b;
    --bg-card: #ffffff; --bg-page: #f5f7fa; --border: #eef2f6;
    --text-primary: #1f3a6b; --text-secondary: #5e6f8d; --text-muted: #94a3b8;
    --green-bg: #e6f7e6; --yellow-bg: #fff8e1; --red-bg: #ffedea;
    --site-sz: #2a5298; --site-qd: #e67e22; --site-cd: #27ae60;
    --source-cs: #27ae60; --source-cj: #e67e22; --source-qa: #2a5298;
}

/* ========== 布局 ========== */
#app { max-width: 1280px; margin: 0 auto; padding: 20px 24px; }

/* ========== 顶部栏 ========== */
.header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
.header-title { font-size: 1.4rem; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 8px; }
.header-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.header-info { font-size: 0.78rem; color: var(--text-muted); }

/* ========== 按钮 ========== */
.btn { padding: 8px 16px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-size: 0.82rem; font-weight: 500; background: var(--bg-card); color: var(--text-primary); transition: all 0.15s; }
.btn:hover { background: #f1f5f9; }
.btn-primary { background: var(--primary); color: white; border-color: var(--primary); }
.btn-primary:hover { background: var(--primary-light); }
.btn-sm { padding: 4px 10px; font-size: 0.72rem; }

/* ========== 站点筛选按钮组 ========== */
.site-filter { display: flex; gap: 2px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.site-filter-btn { padding: 6px 14px; border: none; background: var(--bg-card); cursor: pointer; font-size: 0.8rem; color: var(--text-secondary); transition: all 0.15s; }
.site-filter-btn:hover { background: #f1f5f9; }
.site-filter-btn.active { background: var(--primary); color: white; font-weight: 600; }
.site-filter-btn.active.sz-active { background: var(--site-sz); }
.site-filter-btn.active.qd-active { background: var(--site-qd); }
.site-filter-btn.active.cd-active { background: var(--site-cd); }

/* ========== 周期选择器 ========== */
.week-selector { display: flex; align-items: center; gap: 6px; }
.week-nav-btn { width: 32px; height: 32px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-card); cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; color: var(--primary); }
.week-nav-btn:hover { background: #f1f5f9; }
.week-nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.week-select { padding: 6px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.85rem; background: var(--bg-card); color: var(--text-primary); cursor: pointer; min-width: 180px; }
.unit-switch { display: flex; gap: 2px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-right: 2px; }
.unit-switch-btn { padding: 6px 13px; border: none; background: var(--bg-card); cursor: pointer; font-size: 0.8rem; color: var(--text-secondary); transition: all 0.15s; }
.unit-switch-btn:hover { background: #f1f5f9; }
.unit-switch-btn.active { background: var(--primary); color: white; font-weight: 600; }

/* ========== 加载/错误状态 ========== */
.loading-spinner { text-align: center; padding: 60px 20px; color: var(--text-muted); }
.loading-spinner .spinner { display: inline-block; width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px; }
@keyframes spin { to { transform: rotate(360deg); } }
.error-banner { background: var(--red-bg); border: 1px solid #f5c6cb; border-radius: 8px; padding: 16px 20px; margin-bottom: 20px; color: var(--danger); font-size: 0.85rem; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.info-banner { background: #e8f0fe; border: 1px solid #b6cff5; border-radius: 8px; padding: 10px 20px; margin-bottom: 20px; color: #2a5298; font-size: 0.85rem; }
.error-banner .error-title { font-weight: 600; }
.auth-panel { text-align: center; padding: 40px 20px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; max-width: 500px; margin: 40px auto; }

/* ========== KPI 卡片行 ========== */
.kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-bottom: 24px; }
.kpi-card { background: var(--bg-card); border: 1px solid var(--border); padding: 20px; border-radius: 0; }
.kpi-card .kpi-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.kpi-card .kpi-icon { font-size: 1.2rem; }
.kpi-card .kpi-label { font-size: 0.82rem; color: var(--text-secondary); font-weight: 500; }
.kpi-card .kpi-value { font-size: 2rem; font-weight: 700; color: var(--primary); margin: 4px 0; }
.kpi-card .kpi-sub { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 8px; }
.kpi-card .kpi-trends { display: flex; gap: 12px; flex-wrap: wrap; }
.kpi-trend-item { font-size: 0.78rem; display: flex; align-items: center; gap: 3px; }
.kpi-trend-item .arrow { font-weight: 700; }
.trend-up { color: var(--danger); }
.trend-down { color: var(--success); }
.trend-same { color: var(--primary-light); }

/* ========== 区块 ========== */
.section { background: var(--bg-card); border: 1px solid var(--border); margin-bottom: 24px; padding: 20px 24px; border-radius: 0; }
.section-title { font-size: 1rem; font-weight: 700; color: var(--primary); margin-bottom: 16px; padding-bottom: 10px; border-bottom: 3px solid var(--primary-light); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.section-title .section-meta { font-size: 0.78rem; color: var(--text-muted); font-weight: 400; }

/* ========== 表格 ========== */
.table-wrap { overflow-x: auto; }
.data-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
.data-table th { background: #f8fafc; font-weight: 600; padding: 10px 10px; border-bottom: 2px solid var(--border); text-align: center; white-space: nowrap; position: sticky; top: 0; z-index: 1; }
.data-table td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: center; }
.data-table tbody tr:nth-child(even) td { background: #fafcfd; }
.data-table tbody tr:hover td { background: #f1f5f9; }
.data-table .sortable { cursor: pointer; user-select: none; }
.data-table .sortable:hover { color: var(--primary-light); }
.data-table .sortable .sort-arrow { font-size: 0.65rem; margin-left: 2px; }
.data-table .col-name { text-align: center; font-weight: 500; }
.data-table .col-num { text-align: center; }

/* 抽检明细表格：行间距紧凑 */
#personTable td { padding: 4px 8px; }
#personTable th { padding: 6px 10px; }

/* ========== 标签 ========== */
.tag { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 0.7rem; font-weight: 500; }
.tag-green { background: var(--green-bg); color: var(--success); }
.tag-yellow { background: var(--yellow-bg); color: #b45309; }
.tag-red { background: var(--red-bg); color: var(--danger); }
.site-tag { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 0.7rem; font-weight: 500; }
.site-tag.sz { background: #eef2ff; color: var(--site-sz); }
.site-tag.qd { background: #fff3e0; color: var(--site-qd); }
.site-tag.cd { background: #e6f7e6; color: var(--site-cd); }
.source-tag { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 0.7rem; font-weight: 500; }
.source-tag.cs { background: #e6f7e6; color: var(--source-cs); }
.source-tag.cj { background: #fff3e0; color: var(--source-cj); }
.source-tag.qa { background: #eef2ff; color: var(--source-qa); }

/* ========== 灯色行高亮 ========== */
tr.row-green td { background: #f6fdf6 !important; }
tr.row-yellow td { background: #fffdf5 !important; }
tr.row-red td { background: #fef9f9 !important; }
tr.row-err-low td { background: #f5c6cb !important; }
tr.row-err-mid td { background: #fde8e8 !important; }

/* ========== Tab切换 ========== */
.tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 2px solid var(--border); }
.tab-btn { padding: 8px 20px; border: none; background: transparent; cursor: pointer; font-size: 0.85rem; color: var(--text-secondary); border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.15s; }
.tab-btn:hover { color: var(--primary); }
.tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }

/* ========== 失误分析布局 ========== */
.error-analysis-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
.error-summary { background: #f8fafc; border: 1px solid var(--border); padding: 16px; }
.error-summary .es-title { font-size: 0.85rem; font-weight: 600; margin-bottom: 10px; color: var(--primary); }
.error-summary .es-stat { display: flex; justify-content: space-between; padding: 4px 0; font-size: 0.82rem; border-bottom: 1px dotted var(--border); }
.error-summary .es-stat:last-child { border-bottom: none; }
.error-summary .es-val { font-weight: 600; }
.error-toplist { background: #f8fafc; border: 1px solid var(--border); padding: 16px; }
.error-toplist .et-title { font-size: 0.85rem; font-weight: 600; margin-bottom: 10px; color: var(--primary); }
.error-toplist .et-item { display: flex; align-items: center; padding: 5px 0; font-size: 0.8rem; border-bottom: 1px dotted var(--border); gap: 0; }
.error-toplist .et-item:last-child { border-bottom: none; }
.error-toplist .et-rank { flex: 0 0 30px; text-align: center; font-weight: 600; }
.error-toplist .et-cat { flex: 0 0 140px; font-size: 0.8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
.error-toplist .et-bar-wrap { flex: 1; height: 14px; background: #eef2f6; border-radius: 7px; overflow: hidden; display: flex; align-items: center; margin: 0 10px; }
.error-toplist .et-bar { height: 100%; border-radius: 7px; transition: width 0.3s; margin-left: 0; }
.error-toplist .et-count { flex: 0 0 85px; text-align: right; font-size: 0.8rem; }
.error-toplist .et-trend { flex: 0 0 50px; text-align: center; font-size: 0.78rem; }
.et-bar.cat-0 { background: #c0392b; }
.et-bar.cat-1 { background: #e67e22; }
.et-bar.cat-2 { background: #f39c12; }
.et-bar.cat-3 { background: #2a5298; }
.et-bar.cat-4 { background: #5e6f8d; }
.et-bar-other { background: #b0b8c0; }
/* 双周期对比汇总表（周/月通用，2026-09-05） */
.cmp-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
.cmp-table th { text-align: right; padding: 5px 6px; font-size: 0.72rem; color: #5e6f8d; border-bottom: 1px solid var(--border); }
.cmp-table th:first-child, .cmp-table td:first-child { text-align: left; font-weight: 600; color: var(--text-primary); }
.cmp-table td { text-align: right; padding: 6px 6px; border-bottom: 1px dotted var(--border); }
.cmp-table tr:last-child td { border-bottom: none; }
/* 转置对比表（2026-09-06 样式：列平分宽度/内容居中/底色统一/圆角卡片边缘） */
.cmp-table.cmp-trans { table-layout: fixed; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.cmp-table.cmp-trans th, .cmp-table.cmp-trans td { text-align: center; }
.cmp-table.cmp-trans th:first-child, .cmp-table.cmp-trans td:first-child { text-align: center; width: 15%; color: var(--text-primary); }
/* 月度失误分析：三来源纵排整块（2026-09-05） */
.m-block { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; margin-bottom: 16px; }
.m-block-title { font-size: 0.92rem; font-weight: 700; color: var(--primary); margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
.m-block .sub-title { font-size: 0.8rem; font-weight: 600; color: var(--primary); margin: 14px 0 8px; }
.m-grid2 { display: grid; grid-template-columns: 1fr 1.6fr; gap: 16px; }
.m-grid2 .error-summary, .m-grid2 .error-toplist { height: 100%; }
/* 月度块：类别排比卡 + 月内周度走势卡 并排（2026-09-06） */
.m-flex2 { display: flex; gap: 12px; align-items: stretch; margin-top: 12px; }
.m-flex2 > .error-toplist { flex: 1; min-width: 0; margin-top: 0; }
.error-weektrend { flex: 1; min-width: 0; background: #f8fafc; border: 1px solid var(--border); padding: 16px 14px; }
.error-weektrend .ewt-title { font-size: 0.85rem; font-weight: 600; margin-bottom: 10px; color: var(--primary); }
.ewt-grid { display: grid; align-items: center; column-gap: 4px; }
.ewt-grid + .ewt-grid { margin-top: 3px; }
.ewt-h { text-align: center; font-size: 0.72rem; font-weight: 600; color: #5e6f8d; border-bottom: 1px solid var(--border); padding: 2px 0 4px; }
.ewt-h:first-child { text-align: left; }
.ewt-date { font-weight: 400; color: #94a3b8; }
.ewt-name { font-size: 0.75rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 6px; }
.ewt-cell { height: 24px; line-height: 24px; border-radius: 4px; text-align: center; font-size: 0.75rem; font-weight: 600; }
.ewt-note { margin-top: 8px; font-size: 0.68rem; color: #94a3b8; line-height: 1.6; }
/* 月度失误分析顶部 5 张等宽卡（2026-09-06 整合版：初审/抽检/QA + 明显失误 + 低级·投诉失误） */
.dim5-cards { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
.dim5-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 12px 10px 10px; cursor: pointer; text-align: center; }
.dim5-card:hover { border-color: var(--primary-light); }
.dim5-sel { outline: 2px solid var(--primary); outline-offset: 1px; }
.d5-label { display: flex; align-items: center; justify-content: center; gap: 5px; font-size: 0.75rem; font-weight: 600; color: var(--text-secondary); }
.d5-label i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.d5-num { font-size: 1.55rem; font-weight: 700; line-height: 1.3; margin: 2px 0; }
.d5-sub { font-size: 0.68rem; color: var(--text-muted); min-height: 15px; }
.dim-hint { font-size: 0.72rem; color: #94a3b8; margin: 10px 0 2px; }
/* 明细行隐藏按钮 */
.row-hide-btn { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 50%; background: #f1f5f9; color: #94a3b8; cursor: pointer; font-size: 0.72rem; line-height: 1; }
.row-hide-btn:hover { background: #fee2e2; color: #c0392b; }
@media (max-width: 900px) {
    .m-grid2 { grid-template-columns: 1fr; }
    .m-flex2 { flex-direction: column; }
    .dim5-cards { grid-template-columns: repeat(2, 1fr); }
}

/* ========== 分页 ========== */
.pagination { display: flex; gap: 6px; justify-content: center; align-items: center; margin-top: 16px; }
.pagination button { padding: 6px 12px; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; font-size: 0.78rem; background: var(--bg-card); color: var(--text-primary); }
.pagination button:hover { background: #f1f5f9; }
.pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
.pagination button.active { background: var(--primary); color: white; border-color: var(--primary); }
.pagination .page-info { font-size: 0.78rem; color: var(--text-muted); padding: 0 8px; }

/* ========== 弹窗 ========== */
.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center; z-index: 3000; }
.modal-container { background: white; border: 1px solid var(--border); max-width: 900px; width: 95%; max-height: 85vh; overflow-y: auto; }
.modal-header { background: var(--primary); color: white; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 0.95rem; }
.modal-close-btn { background: rgba(255,255,255,0.2); border: none; color: white; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; }
.modal-body { padding: 16px 20px; }

/* ========== 响应式 ========== */
@media (max-width: 768px) {
    #app { padding: 12px; }
    .kpi-row { grid-template-columns: repeat(2, 1fr); }
    .error-analysis-grid { grid-template-columns: 1fr; }
    .header { flex-direction: column; align-items: flex-start; }
}

/* ========== 打印 ========== */
@media print {
    body { background: white; }
    .header-controls, .btn, .pagination, .tabs, .header-info { display: none !important; }
    .section, .kpi-card { break-inside: avoid; box-shadow: none; }
}

/* ========== 工具 ========== */
.text-right { text-align: right; }
.text-center { text-align: center; }
.text-muted { color: var(--text-muted); }
.text-sm { font-size: 0.78rem; }
.fw-600 { font-weight: 600; }
.mt-8 { margin-top: 8px; }
.clickable { cursor: pointer; color: var(--primary-light); text-decoration: underline; }
.clickable:hover { color: var(--danger); }

</style>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

</head>
<body>
<div id="app">
    <!-- 顶部栏 -->
    <div class="header">
        <div class="header-title">📊 品控周报分析</div>
        <div class="header-controls">
            <div class="week-selector">
                <div class="unit-switch" id="unitSwitch">
                    <button class="unit-switch-btn active" data-unit="week">周</button>
                    <button class="unit-switch-btn" data-unit="month">月</button>
                </div>
                <button class="week-nav-btn" id="btnPrevWeek" title="上一周">◀</button>
                <select class="week-select" id="weekSelect"></select>
                <button class="week-nav-btn" id="btnNextWeek" title="下一周">▶</button>
                <button class="btn btn-primary" id="btnRefresh" style="margin-left:4px;">🔄</button>
                <button class="btn btn-sm" onclick="screenshotSection('kpiRow','核心指标')" title="截图KPI卡片">📸</button>
            </div>
            <div class="site-filter" id="siteFilter">
                <button class="site-filter-btn" data-site="all">🌐 全部</button>
                <button class="site-filter-btn" data-site="深圳">深圳</button>
                <button class="site-filter-btn" data-site="青岛">青岛</button>
                <button class="site-filter-btn active cd-active" data-site="成都">成都</button>
            </div>
        </div>
        <div class="header-info" id="headerInfo"></div>
    </div>

    <!-- 错误/授权横幅 -->
    <div id="bannerArea"></div>

    <!-- 加载状态 -->
    <div id="loadingArea" class="loading-spinner"><div class="spinner"></div><div>正在从飞书加载数据...</div></div>

    <!-- 核心指标 -->
    <div class="kpi-row" id="kpiRow"></div>

    <!-- 周报文本（自动生成，可复制） -->
    <div class="section" id="reportSection" style="display:none;">
        <div class="section-title"><span id="reportTitleText">📝 周报文本（自动生成）</span>
            <span style="display:flex;align-items:center;gap:8px;">
                <button class="btn btn-sm" id="btnCopyReport" style="margin-left:8px;" title="复制周报文本">📋 复制</button>
                <button class="btn btn-sm" id="btnShotReport" onclick="screenshotSection('reportSection', getReportSecLabel())" title="截图周报文本">📸</button>
            </span>
        </div>
        <textarea id="reportText" readonly style="width:100%;height:230px;padding:12px 14px;border:1px solid var(--border);border-radius:6px;font-size:0.82rem;line-height:1.8;font-family:'PingFang SC','Microsoft YaHei',monospace;color:var(--text-primary);background:#fafcfd;resize:vertical;outline:none;"></textarea>
        <div class="section-meta" id="reportHint" style="margin-top:6px;font-size:0.75rem;color:var(--text-muted);">随周次/站点筛选自动更新，点击「复制」即可粘贴到周报</div>
    </div>

    <!-- 抽检明细 -->
    <div class="section" id="personSection" style="display:none;">
        <div class="section-title">👥 抽检明细+失误总览 <button class="btn btn-sm" onclick="screenshotSection('personSection','抽检明细+失误总览')" title="截图抽检明细+失误总览" style="margin-left:8px;">📸</button> <span class="section-meta" id="personMeta"></span></div>
        <div class="table-wrap">
            <table class="data-table" id="personTable" style="table-layout:fixed;">
                <thead>
                    <tr>
                        <th style="width:4%;">#</th>

function getProxyUrlList() {

async function fetchWithTimeout(url, options, timeoutMs) {
    var controller = new AbortController();
    var timer = setTimeout(function() { controller.abort(); }, timeoutMs);
    try {
        return await fetch(url, Object.assign({}, options, { signal: controller.signal }));
    } finally {
        clearTimeout(timer);
    }
}
async function fetchViaProxy(proxyHeaders, options, timeoutMs) {
    var urls = getProxyUrlList();
    var lastErr = null;
    for (var i = 0; i < urls.length; i++) {
        var pu = urls[i];
        if (_proxyDownUntil[pu] && Date.now() < _proxyDownUntil[pu]) continue;
        try {
            var puTimeout = (pu.indexOf('workers.dev') >= 0) ? 5000 : (timeoutMs || 20000);
            var resp = await fetchWithTimeout(pu, {
                method: 'POST',
                headers: proxyHeaders,
                body: (options && options.body) || undefined
            }, puTimeout);
            if (resp.ok) { if (_proxyDownUntil[pu]) delete _proxyDownUntil[pu]; return resp; }
            var _et = '';
            try { _et = await resp.text(); } catch(e) {}
            lastErr = new Error('代理请求失败: ' + resp.status + (_et ? ' ' + _et.substring(0, 120) : ''));
            _proxyDownUntil[pu] = Date.now() + 300000;
        } catch(e) {
            lastErr = e;
            _proxyDownUntil[pu] = Date.now() + 300000;
        }
    }
    throw lastErr || new Error('代理请求失败: 所有线路不可用');
}

async function feishuApiFetch(url, options) {
    options = options || {};
    var proxyHeaders = {
        'Authorization': 'Bearer ' + FEISHU_SUPABASE_KEY,
        'x-target-url': url,
        'x-target-method': options.method || 'GET'
    };
    if (options.headers && options.headers['Authorization']) {
        proxyHeaders['x-target-auth'] = options.headers['Authorization'];
    }
    if (options.headers && options.headers['Content-Type']) {
        proxyHeaders['x-target-content-type'] = options.headers['Content-Type'];
    }
    // gzip压缩传输：大表JSON压缩率达10倍以上，实测161KB vs 2.16MB、2.3s vs 9.7s
    proxyHeaders['Accept-Encoding'] = 'gzip';
    var resp = await fetchViaProxy(proxyHeaders, options, 20000);
    var data = await resp.json();
    if (data.error) { throw new Error(JSON.stringify(data.error)); }
    return { ok: true, json: function() { return Promise.resolve(data); } };
}

async function fetchFeishuSheet(spreadsheetToken, sheetId, token, range) {

    var resp = await feishuApiFetch(url, { headers: { 'Authorization': 'Bearer ' + token } });
    var data = await resp.json();
    if (data.code !== 0) throw new Error(data.msg || '请求失败');
    return (data.data && data.data.valueRange && data.data.valueRange.values) || [];
}

function getLocalToken() {
    var stored = null;
    try { stored = JSON.parse(localStorage.getItem('feishu_token') || 'null'); } catch(e) {}
    if (stored && stored.expiresAt > Date.now() + 60000) {
        if (stored.expiresAt < Date.now() + 300000 && stored.refresh_token) {
            feishuRefreshToken();
        }
        return stored.access_token;
    }
    return null;
}

async function feishuRefreshToken() {
    var stored = null;
    try { stored = JSON.parse(localStorage.getItem('feishu_token') || 'null'); } catch(e) {}
    if (!stored || !stored.refresh_token) return null;
    try {
        var body = JSON.stringify({ app_id: FEISHU_CONFIG.appId, app_secret: FEISHU_CONFIG.appSecret, grant_type: 'refresh_token', refresh_token: stored.refresh_token });
        var resp = await feishuApiFetch('https://open.feishu.cn/open-apis/authen/v1/refresh_access_token', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: body
        });
        var data = await resp.json();
        if (data.code === 0 && data.data) {
            saveToken(data.data.access_token, data.data.refresh_token, data.data.expires_in);
            return data.data.access_token;
        }
    } catch(e) {}
    return null;
}

async function getTenantToken() {
    var stored = null;
    try { stored = JSON.parse(localStorage.getItem('feishu_tenant_token') || 'null'); } catch(e) {}
    if (stored && stored.expiresAt > Date.now() + 60000) return stored.access_token;
    try {
        var body = JSON.stringify({ app_id: FEISHU_CONFIG.appId, app_secret: FEISHU_CONFIG.appSecret });
        var resp = await feishuApiFetch('https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: body
        });
        var data = await resp.json();
        if (data.code === 0 && data.tenant_access_token) {
            var tokenData = { access_token: data.tenant_access_token, expiresAt: Date.now() + (data.expire || 7200) * 1000 - 60000 };
            localStorage.setItem('feishu_tenant_token', JSON.stringify(tokenData));
            return tokenData.access_token;
        }
    } catch(e) {}
    if (stored && stored.expiresAt > Date.now()) return stored.access_token;
    return null;
}

function saveToken(token, refreshToken, expiresIn) {
    var tokenData = { access_token: token, refresh_token: refreshToken, expiresAt: Date.now() + expiresIn * 1000 };
    var tokenStr = JSON.stringify(tokenData);
    localStorage.setItem('feishu_token', tokenStr);
    try {
        fetch(SUPABASE_URL + '/rest/v1/app_data', {
            method: 'POST',
            headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates' },
            body: JSON.stringify({ key: 'feishu_token', value: tokenStr, updated_at: new Date().toISOString() })
        }).catch(function(){});
    } catch(e) {}
    // 双写 Cloudflare KV（带重试应对 workers.dev 间歇性网络）
    syncTokenToCloudflare(tokenStr, 0);
}

// token 写入 Cloudflare KV（Pages + Worker 双写，共用同一 KV 命名空间；带重试：立即 + 30s + 2min + 5min）
function syncTokenToCloudflare(tokenStr, attempt) {
    var targets = [FEISHU_PAGES_PROXY_URL, FEISHU_CLOUDFLARE_PROXY_URL];
    targets.forEach(function(tu) {
        fetch(tu + '/token', {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain', 'x-yxt-secret': 'yxt-feishu-2026' },
            body: tokenStr
        }).then(function(resp) {
            if (!resp.ok) throw new Error('HTTP ' + resp.status);
            console.log('✅ token 已同步到 Cloudflare KV（' + tu + '）');
        }).catch(function(e) {
            if (attempt < 3) {
                var delays = [30000, 120000, 300000];
                setTimeout(function() { syncTokenToCloudflare(tokenStr, attempt + 1); }, delays[attempt]);
            } else {
                console.log('⚠️ token 同步 Cloudflare KV 失败（已重试3次）: ' + e.message);
            }
        });
    });
}

async function exchangeCodeForToken(code) {
    if (!code || !code.trim()) return { success: false, error: '授权码为空' };
    code = code.trim();
    try {
        var appResp = await feishuApiFetch('https://open.feishu.cn/open-apis/auth/v3/app_access_token/internal', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ app_id: FEISHU_CONFIG.appId, app_secret: FEISHU_CONFIG.appSecret })
        });
        var appData = await appResp.json();
        if (appData.code !== 0) return { success: false, error: '获取app_token失败: ' + (appData.msg || appData.code) };
        var tokenResp = await feishuApiFetch('https://open.feishu.cn/open-apis/authen/v1/oidc/access_token', {
            method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + appData.app_access_token },
            body: JSON.stringify({ grant_type: 'authorization_code', code: code })
        });
        var tokenData = await tokenResp.json();
        if (tokenData.code === 0 && tokenData.data) {
            saveToken(tokenData.data.access_token, tokenData.data.refresh_token, tokenData.data.expires_in);
            return { success: true };
        }
        return { success: false, error: tokenData.msg || ('code: ' + tokenData.code) };
    } catch(e) { return { success: false, error: e.message }; }
}

}

// ==================== 5. 日期工具 ====================
function excelSerialToDate(serial) {
    // 用 UTC 取日期部分 + Math.round 消除 46188.99999999 类浮点误差（避免时区偏移导致日期+1天）
    var d = new Date(Math.round((serial - 25569) * 86400) * 1000);
    return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
}

function formatDate(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function formatShortDate(d) {
    return String(d.getMonth() + 1).padStart(2, '0') + '/' + String(d.getDate()).padStart(2, '0');
}

function getLogicMonthOfDate(d) {
    // 逻辑月归月规则（2026-09-05 抽取，周编号与月维度共用）：日期 >=27 日归下月
    var lm = d.getMonth(), ly = d.getFullYear();
    if (d.getDate() >= 27) { lm++; if (lm > 11) { lm = 0; ly++; } }
    return { lm: lm, ly: ly };
}

function getLogicMonthRange(lm, ly) {
    // 逻辑月窗口 [lm 月 27日 00:00, lm 月 26日 23:59:59.999]（new Date 自动处理跨年：lm-1=-1 → 前年12月27）
    return {
        monday: new Date(ly, lm - 1, 27, 0, 0, 0, 0),
        sunday: new Date(ly, lm, 26, 23, 59, 59, 999)
    };
}

function monthLabelOf(start) {
    // 逻辑月窗口起点(27日) → 所属月标签：2026-08-27 → '9月'
    return (getLogicMonthOfDate(start).lm + 1) + '月';
}

function getWeekLabel(monday) {
    // 周序号 = 该逻辑月窗口内从第一个周一起的周次（行为与原实现一致，2026-09-05 抽取公共逻辑月工具）
    var info = getLogicMonthOfDate(monday);
    var lm = info.lm, ly = info.ly;
    var firstMon = new Date(ly, lm - 1, 27);
    while (firstMon.getDay() !== 1) firstMon.setDate(firstMon.getDate() + 1);
    var wn = Math.floor((monday - firstMon) / (7 * 86400000)) + 1;
    return (lm + 1) + '月第' + wn + '周';
}

function getMonday(date) {
    var d = new Date(date);
    var day = d.getDay();
    var diff = day === 0 ? -6 : 1 - day;
    d.setDate(d.getDate() + diff);
    d.setHours(0, 0, 0, 0);
    return d;
}

function getSunday(monday) {
    var d = new Date(monday);
    d.setDate(d.getDate() + 6);
    d.setHours(23, 59, 59, 999);
    return d;
}

function buildWeekOptions() {
    var now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var thisMonday = getMonday(today);
    var options = [];
    // 默认5周（原逻辑）；月补拉后内存数据起点提前（_windowStartDate）→ 周下拉顺带扩档到全部内存周
    var minM = (_windowStartDate && viewUnit === 'month') ? getMonday(_windowStartDate) : null;
    for (var w = 0; w < (minM ? 30 : 5); w++) {
        var monday = new Date(thisMonday);
        monday.setDate(thisMonday.getDate() - w * 7);
        if (minM && monday.getTime() < minM.getTime()) break;
        var sunday = getSunday(monday);
        var label = getWeekLabel(monday) + '（' + formatShortDate(monday) + '~' + formatShortDate(sunday) + '）';
        options.push({ label: label, monday: monday, sunday: sunday, isCurrent: w === 0 });
    }
    return options;
}

function buildMonthOptions() {
    // 逻辑月选项：[本月(27~26), 上月(27~26)]；如 2026-09-05 → [9月(08/27~09/26), 8月(07/27~08/26)]
    var now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var cur = getLogicMonthOfDate(today);
    function mk(lm, ly, isCurrent) {
        var r = getLogicMonthRange(lm, ly);
        return {
            label: monthLabelOf(r.monday) + '（' + formatShortDate(r.monday) + '~' + formatShortDate(r.sunday) + '）',
            monday: r.monday, sunday: r.sunday, isCurrent: isCurrent
        };
    }
    return [mk(cur.lm, cur.ly, true), mk(cur.lm - 1, cur.ly, false)];
}

// ===== 周期维度薄封装（周/月共用，2026-09-05）=====
function getPeriodOptions() { return viewUnit === 'month' ? monthOptions : weekOptions; }
function getCurIndex() { return viewUnit === 'month' ? currentMonthIndex : currentWeekIndex; }
function periodDepth() { return viewUnit === 'month' ? 2 : 4; } // 数据列+趋势窗口的周期数：周=4，月=2
function getPeriodLabel(wd) { return viewUnit === 'month' ? monthLabelOf(wd.monday) : getWeekLabel(wd.monday); }
function unitWords(idx) {
    // 周期文案：周=本周/上周；月=本月/上月（选中上月时无环比词）
    if (viewUnit === 'week') return { cur: '本周', prev: '上周' };
    return idx === 0 ? { cur: '本月', prev: '上月' } : { cur: '上月', prev: null };
}
function parseDateValue(val) {
    if (!val) return null;
    if (val instanceof Date) {
        if (isNaN(val.getTime())) return null;
        return new Date(val.getFullYear(), val.getMonth(), val.getDate());
    }
    var str = String(val).trim();
    if (!str || str === '日期' || str === '时间') return null;
    // 纯数字：Excel序列号（40000-100000）或 8位 YYYYMMDD
    if (/^\d+(\.\d+)?$/.test(str)) {
        var num = parseFloat(str);
        if (num > 40000 && num < 100000) return excelSerialToDate(num);
        if (/^\d{8}$/.test(str)) {
            var y8 = parseInt(str.substring(0, 4)), m8 = parseInt(str.substring(4, 6)), d8 = parseInt(str.substring(6, 8));
            if (y8 >= 2000 && m8 >= 1 && m8 <= 12 && d8 >= 1 && d8 <= 31) return new Date(y8, m8 - 1, d8);
        }
        // 含小数但不在序列号范围（如 "8.9" 表示 8月9日）→ 继续尝试下方日期格式
        if (str.indexOf('.') < 0) return null;
    }
    // 带年份：2026年8月9日 / 2026-08-09 / 2026/8/9 / 2026.8.9（可带时间后缀）
    var m = str.match(/(\d{4})[年\/\-\.](\d{1,2})[月\/\-\.](\d{1,2})/);
    if (m) {
        var yy = parseInt(m[1]), mm = parseInt(m[2]), dd = parseInt(m[3]);
        if (yy >= 2000 && mm >= 1 && mm <= 12 && dd >= 1 && dd <= 31) {
            return new Date(yy, mm - 1, dd);
        }
    }
    // 无年份：8月9日 / 8-9 / 8/9 / 8.9 → 补当年
    var m2 = str.match(/^(\d{1,2})[月\/\-\.](\d{1,2})/);
    if (m2) {
        var mm2 = parseInt(m2[1]), dd2 = parseInt(m2[2]);
        if (mm2 >= 1 && mm2 <= 12 && dd2 >= 1 && dd2 <= 31) {
            return new Date(new Date().getFullYear(), mm2 - 1, dd2);
        }
    }
    return null;
}

function isInWeek(dateObj, monday, sunday) {
    return dateObj >= monday && dateObj <= sunday;
}

// ==================== 6. 数据拉取 ====================
// 从 Supabase 拉取判责量（每日 feishu_panze_YYYY-MM-DD 汇总键：每人当日判责总数）
async function fetchPanZeSupabase(monday, sunday) {
    var dailyList = [];
    try {
        var cur = new Date(monday);
        var end = new Date(sunday);
        var dates = [];
        while (cur <= end) {
            dates.push({ dateStr: formatDate(cur), date: new Date(cur) });
            cur.setDate(cur.getDate() + 1);
        }
        // 8周=56天并行请求（原为串行，是加载慢的主因之一）
        var results = await Promise.all(dates.map(function(d) {
            var key = 'feishu_panze_' + d.dateStr;
            return fetch(SUPABASE_URL + '/rest/v1/app_data?key=eq.' + encodeURIComponent(key) + '&select=value&limit=1', {
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
            }).then(function(resp) { return resp.json(); }).then(function(data) {
                if (data && data.length > 0 && data[0].value) {
                    var found = JSON.parse(data[0].value);
                    if (found.map) return { dateStr: d.dateStr, date: d.date, map: found.map };
                }
                return null;
            }).catch(function() { return null; });
        }));
        results.forEach(function(r) { if (r) dailyList.push(r); });
    } catch(e) {}
    return dailyList;
}

// Supabase 402 期间兜底：从优学堂本地服务（localhost:3456）拉判责量（2026-09-04）
// Supabase 恢复后 fetchPanZeSupabase 正常拿到数据，此函数不再被调用，自动回到 Supabase
// ?after=周起点：本地服务只解析缺失日期的Excel文件（首次解析大文件较慢，超时放宽到3分钟）
async function fetchPanZeLocalFallback(monday, sunday) {
    var dailyList = [];
    try {
        var mondayStr = formatDate(monday), sundayStr = formatDate(sunday);
        var ctrl = new AbortController();
        var timer = setTimeout(function() { ctrl.abort(); }, 180000);
        var resp = await fetch('http://localhost:3456/panze-local?after=' + mondayStr, { signal: ctrl.signal });
        clearTimeout(timer);
        var data = await resp.json();
        if (data && data.ok && Array.isArray(data.dailyList)) {
            data.dailyList.forEach(function(day) {
                if (day.date >= mondayStr && day.date <= sundayStr && day.map) {
                    dailyList.push({ dateStr: day.date, date: new Date(day.date), map: day.map });
                }
            });
        }
    } catch(e) {}
    return dailyList;
}

// KV 兜底（2026-09-04）：本地服务也拉空时，从 CF KV 中转读判责量（panze-daily-sync 在 Supabase 402 期间每天转存）
// 任何设备可用，不依赖主电脑 localhost；Supabase 恢复后页面自动回灌清空 KV，此路自然失效
// 流程：/data/list 拿全部中转 key（不含 sync_ 前缀）→ 过滤日期范围内的 feishu_panze_* → 逐个 get 读值
async function fetchPanZeKvFallback(monday, sunday) {
    var dailyList = [];
    try {
        var listResp = await fetch(FEISHU_PAGES_PROXY_URL + '/data/list', {
            headers: { 'x-yxt-secret': 'yxt-feishu-2026' }
        });
        var listData = await listResp.json();
        if (!listData || !Array.isArray(listData.keys)) return dailyList;
        var mondayStr = formatDate(monday), sundayStr = formatDate(sunday);
        var prefixLen = 'feishu_panze_'.length;
        var target = listData.keys.filter(function(it) {
            if (!it || typeof it.key !== 'string' || it.key.indexOf('feishu_panze_') !== 0) return false;
            var d = it.key.slice(prefixLen);
            return /^\d{4}-\d{2}-\d{2}$/.test(d) && d >= mondayStr && d <= sundayStr;
        });
        if (target.length === 0) return dailyList;
        var results = await Promise.all(target.map(function(it) {
            var d = it.key.slice(prefixLen);
            return fetch(FEISHU_PAGES_PROXY_URL + '/data?key=' + encodeURIComponent(it.key), {
                headers: { 'x-yxt-secret': 'yxt-feishu-2026' }
            }).then(function(r) { return r.json(); }).then(function(resp) {
                // KV 中转值格式 {"v":<原value字符串>, "t":<时间>}，v 为 null 是墓碑（已删除）跳过
                if (resp && typeof resp.value === 'string') {
                    var o = JSON.parse(resp.value);
                    if (o && typeof o.v === 'string' && o.v) {
                        var found = JSON.parse(o.v);
                        if (found && found.map) {
                            return { dateStr: d, date: new Date(d + 'T00:00:00'), map: found.map };
                        }
                    }
                }
                return null;
            }).catch(function() { return null; });
        }));
        results.forEach(function(r) { if (r) dailyList.push(r); });
        console.log('☁️ KV 兜底判责量: ' + dailyList.length + ' 天');
    } catch(e) {}
    return dailyList;
}

var _sheetRowCounts = null; // 缓存sheets/query结果，两阶段加载共用
var _columnACache = {};     // 缓存各sheet的A列（日期列）+最后有效行号，定位两阶段复用
var _sheetLocCache = {};    // 首批抽检表定位结果缓存（二批复用首批起点，避免重叠读取）

// 读取A列（日期列）并定位目标日期对应的起始行，返回 {startRow, endRow}（1-based）
// bufferRows: 起点往前多读的兜底行数（约1天数据，应对日期乱序/格式差异，多余行由周过滤裁掉）
// 定位失败（行数未知/A列读取失败）返回 null，调用方退化为表尾估算行数
async function locateStartRow(spreadsheetToken, sheetId, token, targetDate, bufferRows) {
    try {
        var cache = _columnACache[sheetId];
        if (!cache) {
            var rc = _sheetRowCounts[sheetId] || 0;
            if (!rc) return null;
            // 分块读A列（飞书单请求单元格上限5万，行数超限时自动分块）
            var colA = [];
            for (var chunk = 1; chunk <= rc; chunk += 50000) {
                var endChunk = Math.min(chunk + 49999, rc);
                var part = await fetchFeishuSheet(spreadsheetToken, sheetId, token, 'A' + chunk + ':A' + endChunk);
                colA = colA.concat(part);
            }
            var lastRow = 0; // 最后一个日期有效行（跳过表头和空行）
            for (var i = 0; i < colA.length; i++) {
                if (parseDateValue(colA[i] && colA[i][0])) lastRow = i + 1;
            }
            cache = { colA: colA, lastRow: lastRow };
            _columnACache[sheetId] = cache;
        }
        // 本地线性扫描第一个日期>=target的行（毫秒级，无网络请求）
        var found = cache.lastRow + 1;
        for (var i = 0; i < cache.colA.length; i++) {
            var d = parseDateValue(cache.colA[i] && cache.colA[i][0]);
            if (d && d >= targetDate) { found = i + 1; break; }
        }
        var startRow = Math.max(2, found - bufferRows);
        return { startRow: startRow, endRow: cache.lastRow };
    } catch(e) {
        console.warn('[定位] ' + sheetId + ' A列定位失败，退化为表尾估算:', e.message);
        return null;
    }
}

function getFetchTargets() {
    // 拉取窗口目标（2026-09-05 按维度）：周=原5周两批不变；月=首批本月27日~今天、二批上月27日~26日
    if (viewUnit === 'month') {
        var mo = buildMonthOptions();
        var now = new Date();
        var todayEnd = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59, 999);
        return { firstStart: mo[0].monday, firstEnd: todayEnd, fullStart: mo[1].monday, fullEnd: mo[1].sunday };
    }
    var wk = buildWeekOptions();
    // 与原逻辑对应：首批判责量[2周前周一,本周日]、二批[5周前周一,3周前周日]
    return { firstStart: wk[1].monday, firstEnd: wk[0].sunday, fullStart: wk[4].monday, fullEnd: wk[2].sunday };
}
