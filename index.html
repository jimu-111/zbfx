<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>品控周报分析</title>
<style>
/* ========== 全局重置 ========== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #f5f7fa; color: #1f3a6b; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
}

/* ========== 变量 ========== */
:root {
    --primary: #1f3a6b; --primary-light: #2a5298;
    --success: #27ae60; --warning: #f39c12; --danger: #c0392b;
    --bg-card: #ffffff; --bg-page: #f5f7fa; --border: #eef2f6;
    --text-primary: #1f3a6b; --text-secondary: #5e6f8d; --text-muted: #94a3b8;
    --green-bg: #e6f7e6; --yellow-bg: #fff8e1; --red-bg: #ffedea;
    --site-sz: #2a5298; --site-qd: #e67e22; --site-cd: #27ae60;
    --source-cs: #27ae60; --source-cj: #e67e22; --source-qa: #2a5298;
}

/* ========== 布局 ========== */
#app { max-width: 1280px; margin: 0 auto; padding: 20px 24px; }

/* ========== 顶部栏 ========== */
.header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
.header-title { font-size: 1.4rem; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 8px; }
.header-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.header-info { font-size: 0.78rem; color: var(--text-muted); }

/* ========== 按钮 ========== */
.btn { padding: 8px 16px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-size: 0.82rem; font-weight: 500; background: var(--bg-card); color: var(--text-primary); transition: all 0.15s; }
.btn:hover { background: #f1f5f9; }
.btn-primary { background: var(--primary); color: white; border-color: var(--primary); }
.btn-primary:hover { background: var(--primary-light); }
.btn-sm { padding: 4px 10px; font-size: 0.72rem; }

/* ========== 站点筛选按钮组 ========== */
.site-filter { display: flex; gap: 2px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.site-filter-btn { padding: 6px 14px; border: none; background: var(--bg-card); cursor: pointer; font-size: 0.8rem; color: var(--text-secondary); transition: all 0.15s; }
.site-filter-btn:hover { background: #f1f5f9; }
.site-filter-btn.active { background: var(--primary); color: white; font-weight: 600; }
.site-filter-btn.active.sz-active { background: var(--site-sz); }
.site-filter-btn.active.qd-active { background: var(--site-qd); }
.site-filter-btn.active.cd-active { background: var(--site-cd); }

/* ========== 周期选择器 ========== */
.week-selector { display: flex; align-items: center; gap: 6px; }
.week-nav-btn { width: 32px; height: 32px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-card); cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; color: var(--primary); }
.week-nav-btn:hover { background: #f1f5f9; }
.week-nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.week-select { padding: 6px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.85rem; background: var(--bg-card); color: var(--text-primary); cursor: pointer; min-width: 180px; }

/* ========== 加载/错误状态 ========== */
.loading-spinner { text-align: center; padding: 60px 20px; color: var(--text-muted); }
.loading-spinner .spinner { display: inline-block; width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px; }
@keyframes spin { to { transform: rotate(360deg); } }
.error-banner { background: var(--red-bg); border: 1px solid #f5c6cb; border-radius: 8px; padding: 16px 20px; margin-bottom: 20px; color: var(--danger); font-size: 0.85rem; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.info-banner { background: #e8f0fe; border: 1px solid #b6cff5; border-radius: 8px; padding: 10px 20px; margin-bottom: 20px; color: #2a5298; font-size: 0.85rem; }
.error-banner .error-title { font-weight: 600; }
.auth-panel { text-align: center; padding: 40px 20px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; max-width: 500px; margin: 40px auto; }

/* ========== KPI 卡片行 ========== */
.kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-bottom: 24px; }
.kpi-card { background: var(--bg-card); border: 1px solid var(--border); padding: 20px; border-radius: 0; }
.kpi-card .kpi-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.kpi-card .kpi-icon { font-size: 1.2rem; }
.kpi-card .kpi-label { font-size: 0.82rem; color: var(--text-secondary); font-weight: 500; }
.kpi-card .kpi-value { font-size: 2rem; font-weight: 700; color: var(--primary); margin: 4px 0; }
.kpi-card .kpi-sub { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 8px; }
.kpi-card .kpi-trends { display: flex; gap: 12px; flex-wrap: wrap; }
.kpi-trend-item { font-size: 0.78rem; display: flex; align-items: center; gap: 3px; }
.kpi-trend-item .arrow { font-weight: 700; }
.trend-up { color: var(--danger); }
.trend-down { color: var(--success); }
.trend-same { color: var(--primary-light); }

/* ========== 区块 ========== */
.section { background: var(--bg-card); border: 1px solid var(--border); margin-bottom: 24px; padding: 20px 24px; border-radius: 0; }
.section-title { font-size: 1rem; font-weight: 700; color: var(--primary); margin-bottom: 16px; padding-bottom: 10px; border-bottom: 3px solid var(--primary-light); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.section-title .section-meta { font-size: 0.78rem; color: var(--text-muted); font-weight: 400; }

/* ========== 表格 ========== */
.table-wrap { overflow-x: auto; }
.data-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
.data-table th { background: #f8fafc; font-weight: 600; padding: 10px 10px; border-bottom: 2px solid var(--border); text-align: center; white-space: nowrap; position: sticky; top: 0; z-index: 1; }
.data-table td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: center; }
.data-table tbody tr:nth-child(even) td { background: #fafcfd; }
.data-table tbody tr:hover td { background: #f1f5f9; }
.data-table .sortable { cursor: pointer; user-select: none; }
.data-table .sortable:hover { color: var(--primary-light); }
.data-table .sortable .sort-arrow { font-size: 0.65rem; margin-left: 2px; }
.data-table .col-name { text-align: center; font-weight: 500; }
.data-table .col-num { text-align: center; }

/* 抽检明细表格：行间距紧凑 */
#personTable td { padding: 4px 8px; }
#personTable th { padding: 6px 10px; }

/* ========== 标签 ========== */
.tag { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 0.7rem; font-weight: 500; }
.tag-green { background: var(--green-bg); color: var(--success); }
.tag-yellow { background: var(--yellow-bg); color: #b45309; }
.tag-red { background: var(--red-bg); color: var(--danger); }
.site-tag { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 0.7rem; font-weight: 500; }
.site-tag.sz { background: #eef2ff; color: var(--site-sz); }
.site-tag.qd { background: #fff3e0; color: var(--site-qd); }
.site-tag.cd { background: #e6f7e6; color: var(--site-cd); }
.source-tag { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 0.7rem; font-weight: 500; }
.source-tag.cs { background: #e6f7e6; color: var(--source-cs); }
.source-tag.cj { background: #fff3e0; color: var(--source-cj); }
.source-tag.qa { background: #eef2ff; color: var(--source-qa); }

/* ========== 灯色行高亮 ========== */
tr.row-green td { background: #f6fdf6 !important; }
tr.row-yellow td { background: #fffdf5 !important; }
tr.row-red td { background: #fef9f9 !important; }
tr.row-err-low td { background: #f5c6cb !important; }
tr.row-err-mid td { background: #fde8e8 !important; }

/* ========== Tab切换 ========== */
.tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 2px solid var(--border); }
.tab-btn { padding: 8px 20px; border: none; background: transparent; cursor: pointer; font-size: 0.85rem; color: var(--text-secondary); border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.15s; }
.tab-btn:hover { color: var(--primary); }
.tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }

/* ========== 失误分析布局 ========== */
.error-analysis-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
.error-summary { background: #f8fafc; border: 1px solid var(--border); padding: 16px; }
.error-summary .es-title { font-size: 0.85rem; font-weight: 600; margin-bottom: 10px; color: var(--primary); }
.error-summary .es-stat { display: flex; justify-content: space-between; padding: 4px 0; font-size: 0.82rem; border-bottom: 1px dotted var(--border); }
.error-summary .es-stat:last-child { border-bottom: none; }
.error-summary .es-val { font-weight: 600; }
.error-toplist { background: #f8fafc; border: 1px solid var(--border); padding: 16px; }
.error-toplist .et-title { font-size: 0.85rem; font-weight: 600; margin-bottom: 10px; color: var(--primary); }
.error-toplist .et-item { display: flex; align-items: center; padding: 5px 0; font-size: 0.8rem; border-bottom: 1px dotted var(--border); gap: 0; }
.error-toplist .et-item:last-child { border-bottom: none; }
.error-toplist .et-rank { flex: 0 0 30px; text-align: center; font-weight: 600; }
.error-toplist .et-cat { flex: 0 0 140px; font-size: 0.8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
.error-toplist .et-bar-wrap { flex: 1; height: 14px; background: #eef2f6; border-radius: 7px; overflow: hidden; display: flex; align-items: center; margin: 0 10px; }
.error-toplist .et-bar { height: 100%; border-radius: 7px; transition: width 0.3s; margin-left: 0; }
.error-toplist .et-count { flex: 0 0 85px; text-align: right; font-size: 0.8rem; }
.error-toplist .et-trend { flex: 0 0 50px; text-align: center; font-size: 0.78rem; }
.et-bar.cat-0 { background: #c0392b; }
.et-bar.cat-1 { background: #e67e22; }
.et-bar.cat-2 { background: #f39c12; }
.et-bar.cat-3 { background: #2a5298; }
.et-bar.cat-4 { background: #5e6f8d; }
.et-bar-other { background: #b0b8c0; }

/* ========== 分页 ========== */
.pagination { display: flex; gap: 6px; justify-content: center; align-items: center; margin-top: 16px; }
.pagination button { padding: 6px 12px; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; font-size: 0.78rem; background: var(--bg-card); color: var(--text-primary); }
.pagination button:hover { background: #f1f5f9; }
.pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
.pagination button.active { background: var(--primary); color: white; border-color: var(--primary); }
.pagination .page-info { font-size: 0.78rem; color: var(--text-muted); padding: 0 8px; }

/* ========== 弹窗 ========== */
.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center; z-index: 3000; }
.modal-container { background: white; border: 1px solid var(--border); max-width: 900px; width: 95%; max-height: 85vh; overflow-y: auto; }
.modal-header { background: var(--primary); color: white; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 0.95rem; }
.modal-close-btn { background: rgba(255,255,255,0.2); border: none; color: white; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; }
.modal-body { padding: 16px 20px; }

/* ========== 响应式 ========== */
@media (max-width: 768px) {
    #app { padding: 12px; }
    .kpi-row { grid-template-columns: repeat(2, 1fr); }
    .error-analysis-grid { grid-template-columns: 1fr; }
    .header { flex-direction: column; align-items: flex-start; }
}

/* ========== 打印 ========== */
@media print {
    body { background: white; }
    .header-controls, .btn, .pagination, .tabs, .header-info { display: none !important; }
    .section, .kpi-card { break-inside: avoid; box-shadow: none; }
}

/* ========== 工具 ========== */
.text-right { text-align: right; }
.text-center { text-align: center; }
.text-muted { color: var(--text-muted); }
.text-sm { font-size: 0.78rem; }
.fw-600 { font-weight: 600; }
.mt-8 { margin-top: 8px; }
.clickable { cursor: pointer; color: var(--primary-light); text-decoration: underline; }
.clickable:hover { color: var(--danger); }

</style>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

</head>

<div id="app">

        <div class="header-title">📊 品控周报分析</div>

    </div>

    <!-- 抽检明细 -->
    <div class="section" id="personSection" style="display:none;">
        <div class="section-title">👥 抽检明细 <button class="btn btn-sm" onclick="screenshotSection('personSection','抽检明细')" title="截图抽检明细" style="margin-left:8px;">📸</button> <span class="section-meta" id="personMeta"></span></div>
        <div class="table-wrap">
            <table class="data-table" id="personTable" style="table-layout:fixed;">
                <thead>
                    <tr>
                        <th style="width:10%;">#</th>
                        <th class="sortable" data-sort="name" style="width:10%;">姓名 <span class="sort-arrow"></span></th>
                        <th style="width:10%;">站点</th>

                        <th class="sortable col-num" data-sort="panZe" style="width:10%;">判责量 <span class="sort-arrow"></span></th>
                        <th class="sortable col-num" data-sort="coverage" style="width:10%;">覆盖率 <span class="sort-arrow"></span></th>
                        <th class="sortable col-num" data-sort="errors" style="width:10%;">失误订单 <span class="sort-arrow"></span></th>
                        <th class="sortable col-num" data-sort="accuracy" style="width:10%;">准确率 <span class="sort-arrow">▼</span></th>
                        <th style="width:10%;">四周趋势</th>
                        <th style="width:10%;">变化</th>
                    </tr>
                </thead>
                <tbody id="personTbody"></tbody>
            </table>
        </div>
    </div>

    <!-- 失误分析 -->

        <div class="section-title">🔍 失误分析 <button class="btn btn-sm" onclick="screenshotSection('errorSection','失误分析')" title="截图失误分析" style="margin-left:8px;">📸</button></div>
        <div class="tabs" id="errorTabs">

        <div id="errorTabContent"></div>
    </div>
</div>

async function feishuApiFetch(url, options) {
    options = options || {};
    var proxyHeaders = {
        'Authorization': 'Bearer ' + FEISHU_SUPABASE_KEY,
        'x-target-url': url,
        'x-target-method': options.method || 'GET'
    };
    if (options.headers && options.headers['Authorization']) {
        proxyHeaders['x-target-auth'] = options.headers['Authorization'];
    }
    if (options.headers && options.headers['Content-Type']) {
        proxyHeaders['x-target-content-type'] = options.headers['Content-Type'];
    }
    // gzip压缩传输：大表JSON压缩率达10倍以上，实测161KB vs 2.16MB、2.3s vs 9.7s
    proxyHeaders['Accept-Encoding'] = 'gzip';
    var resp = await fetch(FEISHU_PROXY_URL, {
        method: 'POST',
        headers: proxyHeaders,
        body: options.body || undefined
    });
    if (!resp.ok) {
        var errText = await resp.text();
        throw new Error('代理请求失败: ' + resp.status + ' ' + errText);
    }
    var data = await resp.json();
    if (data.error) { throw new Error(JSON.stringify(data.error)); }
    return { ok: true, json: function() { return Promise.resolve(data); } };
}

async function fetchFeishuSheet(spreadsheetToken, sheetId, token, range) {
    var url = 'https://open.feishu.cn/open-apis/sheets/v2/spreadsheets/' + spreadsheetToken + '/values/' + sheetId + (range ? '!' + range : '') + '?majorDimension=ROWS';
    var resp = await feishuApiFetch(url, { headers: { 'Authorization': 'Bearer ' + token } });
    var data = await resp.json();
    if (data.code !== 0) throw new Error(data.msg || '请求失败');
    return (data.data && data.data.valueRange && data.data.valueRange.values) || [];
}

function getLocalToken() {
    var stored = null;
    try { stored = JSON.parse(localStorage.getItem('feishu_token') || 'null'); } catch(e) {}
    if (stored && stored.expiresAt > Date.now() + 60000) {
        if (stored.expiresAt < Date.now() + 300000 && stored.refresh_token) {
            feishuRefreshToken();
        }
        return stored.access_token;
    }
    return null;
}

async function feishuRefreshToken() {
    var stored = null;
    try { stored = JSON.parse(localStorage.getItem('feishu_token') || 'null'); } catch(e) {}
    if (!stored || !stored.refresh_token) return null;
    try {
        var body = JSON.stringify({ app_id: FEISHU_CONFIG.appId, app_secret: FEISHU_CONFIG.appSecret, grant_type: 'refresh_token', refresh_token: stored.refresh_token });
        var resp = await feishuApiFetch('https://open.feishu.cn/open-apis/authen/v1/refresh_access_token', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: body
        });
        var data = await resp.json();
        if (data.code === 0 && data.data) {
            saveToken(data.data.access_token, data.data.refresh_token, data.data.expires_in);
            return data.data.access_token;
        }
    } catch(e) {}
    return null;
}

async function getCloudToken() {
    try {
        var resp = await fetch(SUPABASE_URL + '/rest/v1/app_data?select=value&key=eq.feishu_token', {
            headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
        });
        var rows = await resp.json();
        if (Array.isArray(rows) && rows.length > 0) {
            var stored = JSON.parse(rows[0].value);
            if (stored && stored.expiresAt > Date.now() + 60000) {
                localStorage.setItem('feishu_token', rows[0].value);
                return stored.access_token;
            }
        }
    } catch(e) {}
    return null;
}

async function getTenantToken() {
    var stored = null;
    try { stored = JSON.parse(localStorage.getItem('feishu_tenant_token') || 'null'); } catch(e) {}
    if (stored && stored.expiresAt > Date.now() + 60000) return stored.access_token;
    try {
        var body = JSON.stringify({ app_id: FEISHU_CONFIG.appId, app_secret: FEISHU_CONFIG.appSecret });
        var resp = await feishuApiFetch('https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: body
        });
        var data = await resp.json();
        if (data.code === 0 && data.tenant_access_token) {
            var tokenData = { access_token: data.tenant_access_token, expiresAt: Date.now() + (data.expire || 7200) * 1000 - 60000 };
            localStorage.setItem('feishu_tenant_token', JSON.stringify(tokenData));
            return tokenData.access_token;
        }
    } catch(e) {}
    if (stored && stored.expiresAt > Date.now()) return stored.access_token;
    return null;
}

function saveToken(token, refreshToken, expiresIn) {
    var tokenData = { access_token: token, refresh_token: refreshToken, expiresAt: Date.now() + expiresIn * 1000 };
    localStorage.setItem('feishu_token', JSON.stringify(tokenData));
    try {
        fetch(SUPABASE_URL + '/rest/v1/app_data', {
            method: 'POST',
            headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates' },
            body: JSON.stringify({ key: 'feishu_token', value: JSON.stringify(tokenData), updated_at: new Date().toISOString() })
        }).catch(function(){});
    } catch(e) {}
}

async function acquireToken() {
    var token = getLocalToken();
    if (token) return token;
    token = await feishuRefreshToken();
    if (token) return token;

    return token;
}

async function exchangeCodeForToken(code) {
    if (!code || !code.trim()) return { success: false, error: '授权码为空' };
    code = code.trim();
    try {
        var appResp = await feishuApiFetch('https://open.feishu.cn/open-apis/auth/v3/app_access_token/internal', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ app_id: FEISHU_CONFIG.appId, app_secret: FEISHU_CONFIG.appSecret })
        });
        var appData = await appResp.json();
        if (appData.code !== 0) return { success: false, error: '获取app_token失败: ' + (appData.msg || appData.code) };
        var tokenResp = await feishuApiFetch('https://open.feishu.cn/open-apis/authen/v1/oidc/access_token', {
            method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + appData.app_access_token },
            body: JSON.stringify({ grant_type: 'authorization_code', code: code })
        });
        var tokenData = await tokenResp.json();
        if (tokenData.code === 0 && tokenData.data) {
            saveToken(tokenData.data.access_token, tokenData.data.refresh_token, tokenData.data.expires_in);
            return { success: true };
        }
        return { success: false, error: tokenData.msg || ('code: ' + tokenData.code) };
    } catch(e) { return { success: false, error: e.message }; }
}

// ==================== 5. 日期工具 ====================
function excelSerialToDate(serial) {
    // 用 UTC 取日期部分 + Math.round 消除 46188.99999999 类浮点误差（避免时区偏移导致日期+1天）
    var d = new Date(Math.round((serial - 25569) * 86400) * 1000);
    return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
}

function formatDate(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function formatShortDate(d) {
    return String(d.getMonth() + 1).padStart(2, '0') + '/' + String(d.getDate()).padStart(2, '0');
}

function getWeekLabel(monday) {
    var d = monday.getDate(), m = monday.getMonth(), y = monday.getFullYear();
    var logicM = d >= 27 ? m + 1 : m;
    if (logicM > 11) { logicM = 0; y++; }
    var startM = logicM - 1;
    if (startM < 0) { startM = 11; y--; }
    var firstMon = new Date(y, startM, 27);
    while (firstMon.getDay() !== 1) firstMon.setDate(firstMon.getDate() + 1);
    var wn = Math.floor((monday - firstMon) / (7 * 86400000)) + 1;
    return (logicM + 1) + '月第' + wn + '周';
}

function getMonday(date) {
    var d = new Date(date);
    var day = d.getDay();
    var diff = day === 0 ? -6 : 1 - day;
    d.setDate(d.getDate() + diff);
    d.setHours(0, 0, 0, 0);
    return d;
}

function getSunday(monday) {
    var d = new Date(monday);
    d.setDate(d.getDate() + 6);
    d.setHours(23, 59, 59, 999);
    return d;
}

function buildWeekOptions() {
    var now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var thisMonday = getMonday(today);
    var options = [];
    for (var w = 0; w < 5; w++) {
        var monday = new Date(thisMonday);
        monday.setDate(thisMonday.getDate() - w * 7);
        var sunday = getSunday(monday);
        var label = getWeekLabel(monday) + '（' + formatShortDate(monday) + '~' + formatShortDate(sunday) + '）';
        options.push({ label: label, monday: monday, sunday: sunday, isCurrent: w === 0 });
    }
    return options;
}

function parseDateValue(val) {
    if (!val) return null;
    if (val instanceof Date) {
        if (isNaN(val.getTime())) return null;
        return new Date(val.getFullYear(), val.getMonth(), val.getDate());
    }
    var str = String(val).trim();
    if (!str || str === '日期' || str === '时间') return null;
    // 纯数字：Excel序列号（40000-100000）或 8位 YYYYMMDD
    if (/^\d+(\.\d+)?$/.test(str)) {
        var num = parseFloat(str);
        if (num > 40000 && num < 100000) return excelSerialToDate(num);
        if (/^\d{8}$/.test(str)) {
            var y8 = parseInt(str.substring(0, 4)), m8 = parseInt(str.substring(4, 6)), d8 = parseInt(str.substring(6, 8));
            if (y8 >= 2000 && m8 >= 1 && m8 <= 12 && d8 >= 1 && d8 <= 31) return new Date(y8, m8 - 1, d8);
        }
        // 含小数但不在序列号范围（如 "8.9" 表示 8月9日）→ 继续尝试下方日期格式
        if (str.indexOf('.') < 0) return null;
    }
    // 带年份：2026年8月9日 / 2026-08-09 / 2026/8/9 / 2026.8.9（可带时间后缀）
    var m = str.match(/(\d{4})[年\/\-\.](\d{1,2})[月\/\-\.](\d{1,2})/);
    if (m) {
        var yy = parseInt(m[1]), mm = parseInt(m[2]), dd = parseInt(m[3]);
        if (yy >= 2000 && mm >= 1 && mm <= 12 && dd >= 1 && dd <= 31) {
            return new Date(yy, mm - 1, dd);
        }
    }
    // 无年份：8月9日 / 8-9 / 8/9 / 8.9 → 补当年
    var m2 = str.match(/^(\d{1,2})[月\/\-\.](\d{1,2})/);
    if (m2) {
        var mm2 = parseInt(m2[1]), dd2 = parseInt(m2[2]);
        if (mm2 >= 1 && mm2 <= 12 && dd2 >= 1 && dd2 <= 31) {
            return new Date(new Date().getFullYear(), mm2 - 1, dd2);
        }
    }
    return null;
}

function isInWeek(dateObj, monday, sunday) {
    return dateObj >= monday && dateObj <= sunday;
}

// 从 Supabase 拉取判责量（每日 feishu_panze_YYYY-MM-DD 汇总键：每人当日判责总数）
async function fetchPanZeSupabase(monday, sunday) {
    var dailyList = [];
    try {
        var cur = new Date(monday);
        var end = new Date(sunday);
        var dates = [];
        while (cur <= end) {
            dates.push({ dateStr: formatDate(cur), date: new Date(cur) });
            cur.setDate(cur.getDate() + 1);
        }
        // 8周=56天并行请求（原为串行，是加载慢的主因之一）
        var results = await Promise.all(dates.map(function(d) {
            var key = 'feishu_panze_' + d.dateStr;
            return fetch(SUPABASE_URL + '/rest/v1/app_data?key=eq.' + encodeURIComponent(key) + '&select=value&limit=1', {
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
            }).then(function(resp) { return resp.json(); }).then(function(data) {
                if (data && data.length > 0 && data[0].value) {
                    var found = JSON.parse(data[0].value);
                    if (found.map) return { dateStr: d.dateStr, date: d.date, map: found.map };
                }
                return null;
            }).catch(function() { return null; });
        }));
        results.forEach(function(r) { if (r) dailyList.push(r); });
    } catch(e) {}
    return dailyList;
}

var _sheetRowCounts = null; // 缓存sheets/query结果，两阶段加载共用
var _columnACache = {};     // 缓存各sheet的A列（日期列）+最后有效行号，定位两阶段复用
var _sheetLocCache = {};    // 首批抽检表定位结果缓存（二批复用首批起点，避免重叠读取）

// 读取A列（日期列）并定位目标日期对应的起始行，返回 {startRow, endRow}（1-based）
// bufferRows: 起点往前多读的兜底行数（约1天数据，应对日期乱序/格式差异，多余行由周过滤裁掉）
// 定位失败（行数未知/A列读取失败）返回 null，调用方退化为表尾估算行数
async function locateStartRow(spreadsheetToken, sheetId, token, targetDate, bufferRows) {
    try {
        var cache = _columnACache[sheetId];
        if (!cache) {
            var rc = _sheetRowCounts[sheetId] || 0;
            if (!rc) return null;
            // 分块读A列（飞书单请求单元格上限5万，行数超限时自动分块）
            var colA = [];
            for (var chunk = 1; chunk <= rc; chunk += 50000) {
                var endChunk = Math.min(chunk + 49999, rc);
                var part = await fetchFeishuSheet(spreadsheetToken, sheetId, token, 'A' + chunk + ':A' + endChunk);
                colA = colA.concat(part);
            }
            var lastRow = 0; // 最后一个日期有效行（跳过表头和空行）
            for (var i = 0; i < colA.length; i++) {
                if (parseDateValue(colA[i] && colA[i][0])) lastRow = i + 1;
            }
            cache = { colA: colA, lastRow: lastRow };
            _columnACache[sheetId] = cache;
        }
        // 本地线性扫描第一个日期>=target的行（毫秒级，无网络请求）
        var found = cache.lastRow + 1;
        for (var i = 0; i < cache.colA.length; i++) {
            var d = parseDateValue(cache.colA[i] && cache.colA[i][0]);
            if (d && d >= targetDate) { found = i + 1; break; }
        }
        var startRow = Math.max(2, found - bufferRows);
        return { startRow: startRow, endRow: cache.lastRow };
    } catch(e) {
        console.warn('[定位] ' + sheetId + ' A列定位失败，退化为表尾估算:', e.message);
        return null;
    }
}

async function fetchAllData(token, phase) {
    // phase: 'first2'=首批（失误表读5周区间，抽检表读2周区间，先渲染）| 'rest2'=二批（抽检表补3~5周区间）
    var isRest = (phase === 'rest2');
    var phaseLabel = isRest ? '[二批]' : '[首批]';
    var wkOpts = buildWeekOptions();
    var targetFirst = wkOpts[1].monday; // 2周前周一：首批抽检表起点
    var targetAll = wkOpts[4].monday;   // 5周前周一：完整5周区间起点
    var BUFFER_ROWS = 500;              // 定位起点往前多读的兜底行数（约1天数据）

    // 先查所有sheet的行数（元数据，很快），两阶段共用缓存
    if (!_sheetRowCounts) {
        _sheetRowCounts = {};
        try {
            var sqUrl = 'https://open.feishu.cn/open-apis/sheets/v3/spreadsheets/' + FEISHU_CONFIG.spreadsheetToken + '/sheets/query';
            var sqResp = await feishuApiFetch(sqUrl, { headers: { 'Authorization': 'Bearer ' + token } });
            var sqData = await sqResp.json();
            if (sqData.code === 0 && sqData.data && sqData.data.sheets) {
                sqData.data.sheets.forEach(function(s) {
                    _sheetRowCounts[s.sheet_id] = (s.grid_properties && s.grid_properties.row_count) || 0;
                });
            }
            console.log('[计时] sheets/query 行数:', JSON.stringify(_sheetRowCounts));
        } catch(e) {
            console.warn('[计时] sheets/query 失败，退化为全量读取:', e.message);
        }
    }
    var sheetRowCounts = _sheetRowCounts;

    // Supabase判责量（每日 feishu_panze_* 同步数据）：首批拉最近2周，二批拉第3~5周
    // 独立域名，与飞书请求并行，不参与飞书串行队列
    var supabaseTask = (async function() {
        var t0 = Date.now();
        try {
            var monday, sunday;
            if (isRest) { monday = wkOpts[4].monday; sunday = wkOpts[2].sunday; }
            else { monday = wkOpts[1].monday; sunday = wkOpts[0].sunday; }
            var dailyList = await fetchPanZeSupabase(monday, sunday);
            console.log('[计时] ' + phaseLabel + ' Supabase判责量 耗时 ' + (Date.now() - t0) + 'ms, 拿到 ' + dailyList.length + ' 天');
            return { ok: true, type: 'panze_supabase', name: 'Supabase判责量', dailyList: dailyList };
        } catch(e) {
            console.log('[计时] ' + phaseLabel + ' Supabase判责量 失败 耗时 ' + (Date.now() - t0) + 'ms: ' + e.message);
            return { ok: false, type: 'panze_supabase', name: 'Supabase判责量', error: e.message };
        }
    })();

    var tAll = Date.now();
    var results = [];
    // 飞书请求串行执行：同一文档的并发请求会被飞书限流互相拖慢（实测单请求1.4秒 vs 并发14秒）
    // 读取策略：读A列按日期定位5周/2周区间起点，只读该区间的数据，列范围收窄到所需列，大幅减少传输量
    try {
        // 失误数据：表小，首批直接按5周日期定位读一次，二批跳过
        for (var i = 0; i < FEISHU_CONFIG.sheets.length; i++) {
            var sh = FEISHU_CONFIG.sheets[i];
            var t0 = Date.now();
            try {
                if (isRest) {
                    console.log('[计时] ' + phaseLabel + ' 失误表 ' + sh.name + ' 无需读取（首批已覆盖5周）');
                    results.push({ ok: true, source: sh.source, name: sh.name, rows: [] });
                    continue;
                }
                var loc = await locateStartRow(FEISHU_CONFIG.spreadsheetToken, sh.id, token, targetAll, BUFFER_ROWS);
                var range;
                if (loc) {
                    range = 'A' + loc.startRow + ':' + sh.colEnd + loc.endRow;
                } else {
                    // 定位失败：退化为表尾1500行估算（覆盖5周约250条，余量充足）
                    var rcF = sheetRowCounts[sh.id] || 0;
                    range = 'A' + Math.max(2, rcF - 1499) + ':' + sh.colEnd + rcF;
                }
                var rows = await fetchFeishuSheet(FEISHU_CONFIG.spreadsheetToken, sh.id, token, range);
                console.log('[计时] ' + phaseLabel + ' 失误表 ' + sh.name + ' 耗时 ' + (Date.now() - t0) + 'ms, 行数 ' + rows.length + ' (range:' + range + ')');
                results.push({ ok: true, source: sh.source, name: sh.name, rows: rows, colDate: sh.colDate, colSite: sh.colSite, colQcCode: sh.colQcCode, colCategory: sh.colCategory, colReviewer: sh.colReviewer, colNote: sh.colNote, colProduct: sh.colProduct });
            } catch(e) {
                console.log('[计时] ' + phaseLabel + ' 失误表 ' + sh.name + ' 失败 耗时 ' + (Date.now() - t0) + 'ms: ' + e.message);
                results.push({ ok: false, source: sh.source, name: sh.name, error: e.message });
            }
        }
        // 抽检数据源：首批按2周日期定位读表尾区间，二批读[5周起点, 2周起点)区间
        for (var j = 0; j < FEISHU_CONFIG.samplingSheets.length; j++) {
            var sh2 = FEISHU_CONFIG.samplingSheets[j];
            var t0b = Date.now();
            try {
                var range2 = null, rows2 = [];
                var loc2 = await locateStartRow(sh2.token, sh2.id, token, isRest ? targetAll : targetFirst, BUFFER_ROWS);
                if (loc2) {
                    var start2 = loc2.startRow, end2 = loc2.endRow;
                    if (isRest) {
                        // 二批：上界=首批起点-1（复用首批定位结果，避免与首批重叠读取）
                        var firstLoc = _sheetLocCache[sh2.id];
                        if (firstLoc) end2 = Math.min(end2, firstLoc.startRow - 1);
                    } else {
                        _sheetLocCache[sh2.id] = loc2;
                    }
                    if (end2 >= start2) range2 = 'A' + start2 + ':' + sh2.colEnd + end2;
                }
                if (!range2 && loc2) {
                    // 定位成功但区间为空（表数据不足2周/5周），无需读取
                    console.log('[计时] ' + phaseLabel + ' 抽检表 ' + sh2.name + ' 定位成功但区间为空，无需读取');
                    results.push({ ok: true, type: sh2.type, name: sh2.name, rows: [] });
                    continue;
                }
                if (!range2) {
                    // 定位失败：退化为表尾估算行数（原方案）
                    var rc2 = sheetRowCounts[sh2.id] || 0;
                    var est2 = Math.max(2, rc2 - (isRest ? sh2.fullRows : sh2.firstRows) + 1);
                    var upper2 = isRest ? (rc2 - sh2.firstRows) : rc2;
                    if (upper2 >= est2) range2 = 'A' + est2 + ':' + sh2.colEnd + upper2;
                    if (!isRest && upper2 >= est2) _sheetLocCache[sh2.id] = { startRow: est2, endRow: rc2 };
                }
                if (range2) {
                    rows2 = await fetchFeishuSheet(sh2.token, sh2.id, token, range2);
                }
                console.log('[计时] ' + phaseLabel + ' 抽检表 ' + sh2.name + ' 耗时 ' + (Date.now() - t0b) + 'ms, 行数 ' + rows2.length + (range2 ? ' (range:' + range2 + ')' : ''));
                results.push({ ok: true, type: sh2.type, name: sh2.name, rows: rows2 });
            } catch(e) {
                console.log('[计时] ' + phaseLabel + ' 抽检表 ' + sh2.name + ' 失败 耗时 ' + (Date.now() - t0b) + 'ms: ' + e.message);
                results.push({ ok: false, type: sh2.type, name: sh2.name, error: e.message });
            }
        }
    } finally {
        results.push(await supabaseTask);
    }
    console.log('[计时] ' + phaseLabel + ' 本阶段完成 总耗时 ' + (Date.now() - tAll) + 'ms');
    return results;
}

// 合并两阶段结果：二批(第3~5周)在前、首批(最近2周)在后（rows均已去表头并按日期裁剪，直接拼接）
function mergePhaseResults(firstList, restList) {
    return firstList.map(function(r) {
        if (!r.ok) return r;
        var mate = null;
        for (var i = 0; i < restList.length; i++) {
            if (restList[i].ok && restList[i].name === r.name) { mate = restList[i]; break; }
        }
        if (!mate) return r;
        if (r.rows && mate.rows && mate.rows.length > 0) {
            return Object.assign({}, r, { rows: mate.rows.concat(r.rows) });
        }
        if (r.dailyList && mate.dailyList && mate.dailyList.length > 0) {
            return Object.assign({}, r, { dailyList: mate.dailyList.concat(r.dailyList) });
        }
        return r;
    });
}

function processResults(results) {
    var errors = [];
    var sampling = { online: [], physical: [] };
    var status = {};

    results.forEach(function(res) {
        if (!res.ok) {
            status[res.name || res.source || res.type] = { ok: false, error: res.error };
            return;
        }
        if (res.source) {
            // 失误数据（fetchAllData已去表头并按日期裁剪，从第0行遍历）
            status[res.name] = { ok: true, count: (res.rows || []).length };
            for (var r = 0; r < res.rows.length; r++) {
                var row = res.rows[r];
                if (!row || row.length === 0) continue;
                var dateVal = row[res.colDate];
                if (dateVal === null || dateVal === undefined || dateVal === '日期') continue;
                var dateObj = parseDateValue(dateVal);
                if (!dateObj) continue;
                var category = (row[res.colCategory] || '').toString().trim();
                var reviewer = (row[res.colReviewer] || '').toString().trim();
                reviewer = reviewer.replace(/解答失误$/, '').replace(/解答$/, '').trim();
                var note = (row[res.colNote] || '').toString().trim();
                var site = (row[res.colSite] || '').toString().trim();
                if (!site && SITE_MAP[reviewer]) site = SITE_MAP[reviewer];
                var qcCode = (row[res.colQcCode] || '').toString().trim();
                var product = res.colProduct >= 0 ? ((row[res.colProduct] || '') + '').trim() : '';
                if (!category && !note) continue;
                errors.push({
                    date: dateObj, dateStr: formatDate(dateObj),
                    site: site, qcCode: qcCode, category: category || '-',
                    reviewer: reviewer || '-', note: note || '-',
                    product: product || '-', source: res.source
                });
            }
        } else if (res.type === 'panze') {
            // 判责数据源（来自8pTEgS表）
            status[res.name] = { ok: true, count: (res.records || []).length };
            panZeRecords = res.records || [];
        } else if (res.type === 'panze_supabase') {
            // Supabase判责量（每日feishu_panze_*同步）
            status[res.name] = { ok: true, count: (res.dailyList || []).length };
            panZeSupabaseDaily = res.dailyList || [];
        } else if (res.type) {
            // 抽检数据源（线上/实物）（fetchAllData已去表头并按日期裁剪，从第0行遍历）
            status[res.name] = { ok: true, count: (res.rows || []).length };
            var arr = res.type === 'online' ? sampling.online : sampling.physical;
            for (var r2 = 0; r2 < res.rows.length; r2++) {
                var row2 = res.rows[r2];
                if (!row2 || !row2[0]) continue;
                var dateObj2 = parseDateValue(row2[0]);
                if (!dateObj2) continue;
                var site2 = String(row2[1] || '').trim();
                var reviewer2 = String(row2[5] || '').trim();  // F列=初审人（抽检明细表的抽检量按初审人计数）
                var sampler2 = String(row2[6] || '').trim();   // G列=抽检人（周报文本括号按抽检人计数）
                arr.push({ date: dateObj2, site: site2, reviewer: reviewer2, sampler: sampler2 });
            }
        }
    });

    errors.sort(function(a, b) { return b.date - a.date; });
    return { errors: errors, sampling: sampling, status: status };
}

// ==================== 7. 数据聚合计算 ====================
function siteMatch(item, siteFilter) {
    if (siteFilter === 'all') return true;
    return item.site === siteFilter;
}

function computeWeekData(errors, sampling, panZe, monday, sunday, siteFilter) {
    siteFilter = siteFilter || 'all';
    // 过滤本周失误 + 站点
    var weekErrors = errors.filter(function(e) { return isInWeek(e.date, monday, sunday) && siteMatch(e, siteFilter); });

    // 过滤本周抽检（线上+实物订单量）+ 站点
    var onlineInWeek = sampling.online.filter(function(s) { return isInWeek(s.date, monday, sunday) && siteMatch(s, siteFilter); });
    var physicalInWeek = sampling.physical.filter(function(s) { return isInWeek(s.date, monday, sunday) && siteMatch(s, siteFilter); });

    var onlineCount = onlineInWeek.length;
    var physicalCount = physicalInWeek.length;
    var totalSampling = onlineCount + physicalCount;

    // 按人聚合抽检量（线上+实物表按G列抽检人计数，与周报文本同一口径；不再读判责表）
    var personSampling = {};
    onlineInWeek.forEach(function(s) {
        var name = fixPanZeName(s.reviewer);
        if (!name) return;
        if (!personSampling[name]) personSampling[name] = { sampling: 0, online: 0, physical: 0, site: s.site };
        personSampling[name].sampling++;
        personSampling[name].online++;
        if (!personSampling[name].site && SITE_MAP[name]) personSampling[name].site = SITE_MAP[name];
    });
    physicalInWeek.forEach(function(s) {
        var name = fixPanZeName(s.reviewer);
        if (!name) return;
        if (!personSampling[name]) personSampling[name] = { sampling: 0, online: 0, physical: 0, site: s.site };
        personSampling[name].sampling++;
        personSampling[name].physical++;
        if (!personSampling[name].site && SITE_MAP[name]) personSampling[name].site = SITE_MAP[name];
    });

    // 按人聚合判责量（来自Supabase每日同步 feishu_panze_*，按周过滤）
    // 名字先过fixPanZeName统一口径；站点归属SITE_MAP优先，其次用本周抽检记录中的站点兜底（新人员）
    var personPanZeSupabase = {};
    var droppedPanZeNames = {}; // 无站点归属被丢弃的人（仅提示用）
    (panZeSupabaseDaily || []).forEach(function(daily) {
        if (isInWeek(daily.date, monday, sunday)) {
            var map = daily.map || {};
            Object.keys(map).forEach(function(rawName) {
                var name = fixPanZeName(rawName);
                if (!name) return;
                var personSite = SITE_MAP[name] || '';
                if (!personSite && personSampling[name]) personSite = personSampling[name].site || '';
                // 站点过滤：选具体站点时只保留该站点的人；站点不同是正常过滤，完全无归属才记入提示
                if (siteFilter !== 'all' && personSite !== siteFilter) {
                    if (!personSite) droppedPanZeNames[name] = (droppedPanZeNames[name] || 0) + 1;
                    return;
                }
                // map值 = {品类:数量}，每人当日判责量 = 各品类求和
                var v = map[rawName];
                var count = 0;
                if (v && typeof v === 'object') {
                    Object.keys(v).forEach(function(k) { count += Number(v[k]) || 0; });
                } else {
                    count = Number(v) || 0;
                }
                personPanZeSupabase[name] = (personPanZeSupabase[name] || 0) + count;
            });
        }
    });


    // 按人聚合失误量（按来源分）
    var personErrors = {};
    weekErrors.forEach(function(e) {
        var name = fixPanZeName(e.reviewer) || '未知';
        if (!personErrors[name]) personErrors[name] = { total: 0, 初审: 0, 抽检: 0, QA: 0 };
        personErrors[name].total++;
        if (e.source === '初审') personErrors[name]['初审']++;
        else if (e.source === '抽检') personErrors[name]['抽检']++;
        else if (e.source === 'QA') personErrors[name]['QA']++;
    });

    // 按人合并
    var allNames = new Set();
    Object.keys(personSampling).forEach(function(n) { allNames.add(n); });
    Object.keys(personErrors).forEach(function(n) { allNames.add(n); });
    Object.keys(personPanZeSupabase).forEach(function(n) { allNames.add(n); });

    var personStats = [];
    allNames.forEach(function(name) {
        var s = personSampling[name] || { sampling: 0, online: 0, physical: 0, site: SITE_MAP[name] || '' };
        var e = personErrors[name] || { total: 0, 初审: 0, 抽检: 0, QA: 0 };
        var pz = personPanZeSupabase[name] || 0;
        var cjErrs = e['抽检'] || 0;  // 只算抽检失误
        var acc = s.sampling > 0 ? ((s.sampling - cjErrs) / s.sampling * 100) : 100; // 准确率=抽检失误
        var cov = pz > 0 ? Math.min(100, s.sampling / pz * 100) : 0;        // 覆盖率=抽检量/判责量
        personStats.push({
            name: name,
            site: s.site || SITE_MAP[name] || '',
            sampling: s.sampling,
            online: s.online,
            physical: s.physical,
            panZe: pz,
            errors: cjErrs,  // 只显示抽检失误
            errorsCS: e['初审'],
            errorsCJ: e['抽检'],
            errorsQA: e['QA'],
            rate: s.sampling > 0 ? (cjErrs / s.sampling * 100) : 0,
            accuracy: acc,
            coverage: cov
        });
    });

    // 失误类别聚合（按来源分）
    var categoriesBySource = { 初审: {}, 抽检: {}, QA: {} };
    weekErrors.forEach(function(e) {
        var src = e.source;
        if (!categoriesBySource[src]) categoriesBySource[src] = {};
        var cat = e.category;
        categoriesBySource[src][cat] = (categoriesBySource[src][cat] || 0) + 1;
    });

    var categoryStats = {};
    Object.keys(categoriesBySource).forEach(function(src) {
        var cats = categoriesBySource[src];
        var sorted = Object.keys(cats).map(function(c) { return { name: c, count: cats[c] }; });
        sorted.sort(function(a, b) { return b.count - a.count; });
        categoryStats[src] = sorted;
    });

    // 抽检覆盖率相关
    var sampledPeople = Object.keys(personSampling).length;
    var allPeople = allNames.size;

    // 判责量：使用Supabase每日同步数据（优学堂后台每日汇总的每人判责总数）
    var supabaseTotal = 0;
    Object.keys(personPanZeSupabase).forEach(function(n) { supabaseTotal += personPanZeSupabase[n]; });
    var judgmentCount = supabaseTotal;

    // 抽检覆盖率 = 抽检量 / 判责量（注意：必须在judgmentCount之后计算）
    var coverage = judgmentCount > 0 ? (totalSampling / judgmentCount * 100) : 0;

    // 抽检准确率 = (抽检量 - 抽检失误量) / 抽检量
    var cjErrors = weekErrors.filter(function(e) { return e.source === '抽检'; }).length;
    var accuracy = totalSampling > 0 ? ((totalSampling - cjErrors) / totalSampling * 100) : 100;

    // 有效抽检天数
    var distinctDates = {};
    onlineInWeek.forEach(function(s) { distinctDates[formatDate(s.date)] = 1; });
    physicalInWeek.forEach(function(s) { distinctDates[formatDate(s.date)] = 1; });
    var activeDays = Object.keys(distinctDates).length;

    // 抽检日均人效 = 抽检量 / 有效天数
    var dailyAvgEfficiency = activeDays > 0 ? Math.round(totalSampling / activeDays) : 0;

    // 判责准确率 = (判责量 - 总失误数) / 判责量
    var panZeAccuracy = judgmentCount > 0 ? ((judgmentCount - weekErrors.length) / judgmentCount * 100) : 100;

    return {
        monday: monday, sunday: sunday,
        onlineCount: onlineCount, physicalCount: physicalCount,
        totalSampling: totalSampling,
        judgmentCount: judgmentCount,  // 判责量（优先Supabase每日同步，降级飞书8pTEgS）
        coverage: coverage,
        accuracy: accuracy,
        cjErrors: cjErrors,
        csErrors: weekErrors.filter(function(e) { return e.source === '初审'; }).length,
        qaErrors: weekErrors.filter(function(e) { return e.source === 'QA'; }).length,
        totalErrors: weekErrors.length,
        activeDays: activeDays,
        dailyAvgEfficiency: dailyAvgEfficiency,
        panZeAccuracy: panZeAccuracy,
        personStats: personStats,
        categoryStats: categoryStats,
        personCount: allPeople,
        sampledCount: sampledPeople,
        droppedPanZeNames: Object.keys(droppedPanZeNames)
    };
}

function computeAllWeeks(errors, sampling, panZe, weekOptions, siteFilter) {
    return weekOptions.map(function(opt) {
        return computeWeekData(errors, sampling, panZe, opt.monday, opt.sunday, siteFilter);
    });
}

function computeTrend(current, previous, sensitive) {
    if (!previous || previous === 0) return { text: '--', cls: 'trend-same', arrow: '→', pct: 0 };
    if (sensitive) {
        // 高精度指标（如准确率）：直接用百分点差值，阈值 0.005pp
        var pp = current - previous;
        if (Math.abs(pp) < 0.005) return { text: '→持平', cls: 'trend-same', arrow: '→', pct: 0 };
        if (pp > 0) return { text: '↑' + Math.abs(pp).toFixed(2) + 'pp', cls: 'trend-up', arrow: '↑', pct: pp };
        return { text: '↓' + Math.abs(pp).toFixed(2) + 'pp', cls: 'trend-down', arrow: '↓', pct: pp };
    }
    var pct = (current - previous) / previous * 100;
    if (Math.abs(pct) < 0.5) return { text: '→持平', cls: 'trend-same', arrow: '→', pct: 0 };
    if (pct > 0) return { text: '↑' + Math.abs(pct).toFixed(2) + '%', cls: 'trend-up', arrow: '↑', pct: pct };
    return { text: '↓' + Math.abs(pct).toFixed(2) + '%', cls: 'trend-down', arrow: '↓', pct: pct };
}

function getLightClass(rate) {
    if (rate <= 10) return 'row-green';
    if (rate <= 20) return 'row-yellow';
    return 'row-red';
}

function getLightTag(rate) {
    if (rate <= 10) return '<span class="tag tag-green">🟢 稳定</span>';
    if (rate <= 20) return '<span class="tag tag-yellow">🟡 关注</span>';
    return '<span class="tag tag-red">🔴 预警</span>';
}

// ==================== 8. UI渲染 ====================
function renderKpiTable(weekData, allWeeks) {
    // 取至多4周数据：当前周 + 前3周
    var weeks = [];
    for (var w = 0; w < 4; w++) {
        var idx = currentWeekIndex + w;
        weeks.push((idx < allWeeks.length && allWeeks[idx]) ? allWeeks[idx] : null);
    }
    // weeks[0]=选中周, weeks[1]=上周, weeks[2]=前周, weeks[3]=前三周

    // 辅助：格式化环比（本周 vs 上周）
    function deltaVal(cur, prev, unit) {
        if (prev === null || prev === undefined) return '--';
        var d = cur - prev;
        if (unit === 'pp') return (d >= 0 ? '+' : '') + d.toFixed(2) + '%';
        if (unit === 'pct') return (d >= 0 ? '+' : '') + d.toFixed(2) + '%';
        return (d >= 0 ? '+' : '') + Math.round(d);
    }

    function deltaColor(cur, prev) {
        if (prev === null || prev === undefined) return '#94a3b8';
        return cur > prev ? '#27ae60' : (cur < prev ? '#c0392b' : '#94a3b8');
    }

    // 取每个指标4周的值
    function vals(field) { return weeks.map(function(w) { return w ? w[field] : null; }); }

    var rows = [
        { label: '累计抽检台数', unit: 'int', field: 'totalSampling', format: function(v) { return v; }, threshold: null, invert: false },
        { label: '有效抽检天数', unit: 'int', field: 'activeDays', format: function(v) { return v; }, threshold: null, invert: false },
        { label: '抽检日均人效', unit: 'int', field: 'dailyAvgEfficiency', format: function(v) { return v; }, threshold: null, invert: false },
        { label: '站点总判责量', unit: 'int', field: 'judgmentCount', format: function(v) { return v; }, threshold: null, invert: false },
        { label: '实际抽检占比(15%)', unit: 'pct', field: 'coverage', format: function(v) { return v.toFixed(2) + '%'; }, threshold: 15, invert: false },
        { label: '抽检失误数', unit: 'int', field: 'cjErrors', format: function(v) { return v; }, threshold: null, invert: true },
        { label: '抽检准确率(99%)', unit: 'pp', field: 'accuracy', format: function(v) { return v.toFixed(2) + '%'; }, threshold: 99, invert: false },
        { label: '品控失误数', unit: 'int', field: 'totalErrors', format: function(v) { return v; }, threshold: null, invert: true },
        { label: '判责准确率(99.5%)', unit: 'pp', field: 'panZeAccuracy', format: function(v) { return v.toFixed(2) + '%'; }, threshold: 99.5, invert: false }
    ];

    var colCount = weeks.length + 3; // 指标 + 环比 + N周 + 趋势
    var colWidth = (100 / colCount).toFixed(1) + '%';
    var html = '<div class="table-wrap"><table class="data-table" style="font-size:0.8rem;table-layout:fixed;">';
    // 表头
    html += '<thead><tr><th style="width:' + colWidth + ';">指标</th><th style="width:' + colWidth + ';">环比</th>';
    weeks.forEach(function(w, i) {
        var label = w ? getWeekLabel(w.monday) : '--';
        var dateRange = w ? formatShortDate(w.monday) + '~' + formatShortDate(w.sunday) : '';
        var cellContent = (i === 0 ? '📌 ' : '') + label + '<br><span style="font-weight:400;font-size:0.7rem;color:#5e6f8d;">' + dateRange + '</span>';
        html += '<th style="width:' + colWidth + ';">' + cellContent + '</th>';
    });
    html += '<th style="width:' + colWidth + ';">趋势</th></tr></thead><tbody>';

    // 数据行
    rows.forEach(function(row) {
        var data = vals(row.field);
        var cur = data[0], prev = data[1];
        var dVal = (cur !== null && prev !== null) ? deltaVal(cur, prev, row.unit) : '--';
        var dColor = (cur !== null && prev !== null) ? (row.invert ? deltaColor(prev, cur) : deltaColor(cur, prev)) : '#94a3b8';

        // 迷你趋势图（从旧到新排列）
        var sparkVals = data.slice().reverse(); // 反转：旧→新
        var sparkSVG = buildSparkline(sparkVals, 80, 26);

        html += '<tr>';
        html += '<td style="font-weight:600;">' + row.label + '</td>';
        html += '<td style="color:' + dColor + ';font-weight:600;font-size:0.78rem;">' + dVal + '</td>';
        data.forEach(function(v, i) {
            var colorStyle = '';
            if (row.threshold !== null && v !== null && v < row.threshold) {
                colorStyle = 'color:#c0392b;';
            }
            html += '<td style="font-weight:' + (i === 0 ? '700' : '400') + ';' + colorStyle + '">' + (v !== null ? row.format(v) : '--') + '</td>';
        });
        html += '<td>' + (sparkSVG || '<span class="text-muted">--</span>') + '</td>';
        html += '</tr>';
    });

    html += '</tbody></table></div>';
    document.getElementById('kpiRow').innerHTML = html;
    document.getElementById('kpiRow').style.display = '';
}

function showKpiTrendPopup(type) {
    var allWeeks = window._allWeeksCache || [];
    if (allWeeks.length < 2) return;

    var titles = { sampling: '📦 抽检量', judgment: '⚖️ 判责量', coverage: '📐 抽检覆盖率', accuracy: '🎯 抽检准确率' };
    var title = titles[type] || type;

    // 以选中周为基准，收集至多4周数据（从旧到新排列，选中周在最右）
    var sel = currentWeekIndex;
    var popWeeks = [];
    for (var pw = Math.min(sel + 3, allWeeks.length - 1); pw >= sel; pw--) {
        if (pw < allWeeks.length && allWeeks[pw]) popWeeks.push(allWeeks[pw]);
    }
    // 已按从旧到新排列（高索引=旧周先push），选中周在最后

    var selLabel = allWeeks[sel] ? getWeekLabel(allWeeks[sel].monday) : '';

    // 收集4周卡片（从旧到新显示，选中周在最后=高亮）
    var weekCards = '';
    for (var wc = 0; wc < popWeeks.length; wc++) {
        var wd = popWeeks[wc];
        if (!wd) continue;
        var val, sub;
        switch (type) {
            case 'sampling':
                val = wd.totalSampling;
                sub = '线上:' + wd.onlineCount + '<br>实物:' + wd.physicalCount;
                break;
            case 'judgment':
                val = wd.judgmentCount;
                sub = '判责总量';
                break;
            case 'coverage':
                var covVal = wd.judgmentCount > 0 ? (wd.totalSampling / wd.judgmentCount * 100) : 0;
                val = covVal.toFixed(2) + '%';
                sub = '抽检' + wd.totalSampling + '/判责' + wd.judgmentCount;
                break;
            case 'accuracy':
                val = wd.accuracy.toFixed(2) + '%';
                sub = '失误:' + wd.cjErrors + '单<br>抽检:' + wd.totalSampling + '单';
                break;
        }
        var label = getWeekLabel(wd.monday);
        var isSel = (wc === popWeeks.length - 1);
        weekCards += '<div style="background:' + (isSel ? '#f1f5f9' : '#fafcfd') + ';border:1px solid ' + (isSel ? '#2a5298' : '#eef2f6') + ';padding:14px 16px;border-radius:0;">' +
            '<div style="font-size:0.75rem;color:#5e6f8d;margin-bottom:4px;">' + (isSel ? '📌 ' : '📅 ') + label + '</div>' +
            '<div style="font-size:1.4rem;font-weight:700;color:#1f3a6b;">' + val + '</div>' +
            '<div style="font-size:0.72rem;color:#94a3b8;">' + sub + '</div>' +
            '</div>';
    }

    // 补齐到4列（不足4周时用占位卡）
    var cardCount = (weekCards.match(/<\/div>/g) || []).length;
    while (cardCount < 12) {
        weekCards += '<div style="background:#fafcfd;border:1px dashed #eef2f6;padding:14px 16px;border-radius:0;display:flex;align-items:center;justify-content:center;"><span class="text-muted" style="font-size:0.75rem;">无数据</span></div>';
        cardCount += 3;
    }

    // 收集趋势数据（从旧到新，用于折线图）
    var labels = [], values = [], weekLabels = [];
    for (var wv = 0; wv < popWeeks.length; wv++) {
        var wd2 = popWeeks[wv];
        if (!wd2) continue;
        weekLabels.push(getWeekLabel(wd2.monday));
        var v2;
        switch (type) {
            case 'sampling': v2 = wd2.totalSampling; break;
            case 'judgment': v2 = wd2.judgmentCount; break;
            case 'coverage': v2 = wd2.judgmentCount > 0 ? (wd2.totalSampling / wd2.judgmentCount * 100) : 0; break;
            case 'accuracy': v2 = wd2.accuracy; break;
        }
        labels.push((type === 'coverage' || type === 'accuracy') ? v2.toFixed(2) + '%' : String(v2));
        values.push(v2);
    }

    // 构建带标签的SVG趋势图
    var chartW = 500, chartH = 140, padL = 50, padR = 20, padT = 24, padB = 34;
    var plotW = chartW - padL - padR, plotH = chartH - padT - padB;
    var validVals = values.filter(function(v3) { return v3 !== null && v3 !== undefined; });
    var minV = validVals.length > 0 ? Math.min.apply(null, validVals) : 0;
    var maxV = validVals.length > 0 ? Math.max.apply(null, validVals) : 1;
    var range = maxV - minV || 1;
    var n = values.length;

    var points = [], svgCircles = '', svgLabels = '', svgXLabels = '';
    for (var pi = 0; pi < n; pi++) {
        if (values[pi] === null || values[pi] === undefined) continue;
        var cx = padL + (n > 1 ? (pi / (n - 1)) * plotW : plotW / 2);
        var cy = padT + (1 - (values[pi] - minV) / range) * plotH;
        points.push(cx.toFixed(1) + ',' + cy.toFixed(1));
        var isLast = (pi === n - 1);
        svgCircles += '<circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="' + (isLast ? '5' : '4') + '" fill="' + (isLast ? '#1f3a6b' : '#2a5298') + '" stroke="white" stroke-width="2"/>';
        svgLabels += '<text x="' + cx.toFixed(1) + '" y="' + (cy - 10).toFixed(1) + '" text-anchor="middle" font-size="11" fill="#1f3a6b" font-weight="600">' + labels[pi] + '</text>';
        svgXLabels += '<text x="' + cx.toFixed(1) + '" y="' + (chartH - 6).toFixed(0) + '" text-anchor="middle" font-size="10" fill="#5e6f8d">' + weekLabels[pi] + '</text>';
    }

    var trendSVG2 = points.length >= 2 ?
        '<svg viewBox="0 0 ' + chartW + ' ' + chartH + '" style="display:block;width:100%;max-width:500px;height:auto;margin:0 auto;">' +
            '<line x1="' + padL + '" y1="' + padT + '" x2="' + padL + '" y2="' + (padT + plotH) + '" stroke="#eef2f6" stroke-width="1"/>' +
            '<line x1="' + padL + '" y1="' + (padT + plotH) + '" x2="' + (padL + plotW) + '" y2="' + (padT + plotH) + '" stroke="#eef2f6" stroke-width="1"/>' +
            '<polyline points="' + points.join(' ') + '" fill="none" stroke="#2a5298" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' +
            svgCircles + svgLabels + svgXLabels +
        '</svg>' : '';

    var trendIconBig = getTrendIcon(values);

    var overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = '<div class="modal-container" style="max-width:620px;">' +
        '<div class="modal-header">' + title + ' 趋势（📌 ' + selLabel + '）<button class="modal-close-btn" id="kpiClose">✕</button></div>' +
        '<div class="modal-body">' +
            '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;">' + weekCards + '</div>' +
            '<div style="text-align:center;padding:10px 0;">' +
                '<div style="font-weight:600;margin-bottom:6px;color:#1f3a6b;">📈 近4周趋势（折线右端 = 选中周）</div>' +
                (trendSVG2 || '<span class="text-muted">数据不足</span>') +
                '<div style="margin-top:4px;font-size:1.3rem;">' + trendIconBig + '</div>' +
            '</div>' +
        '</div>' +
    '</div>';
    document.body.appendChild(overlay);
    overlay.querySelector('#kpiClose').onclick = function() { overlay.remove(); };
    overlay.onclick = function(e) { if (e.target === overlay) overlay.remove(); };
}

function sortPersonStats(stats, col, asc) {
    return stats.slice().sort(function(a, b) {
        var va, vb;
        switch (col) {
            case 'name': va = a.name; vb = b.name; break;
            case 'sampling': va = a.sampling; vb = b.sampling; break;
            case 'panZe': va = a.panZe; vb = b.panZe; break;
            case 'coverage': va = a.coverage; vb = b.coverage; break;
            case 'errors': va = a.errors; vb = b.errors; break;
            case 'accuracy': va = a.accuracy; vb = b.accuracy; break;
            case 'rate':
            default: va = a.rate; vb = b.rate; break;
        }
        if (typeof va === 'string') return asc ? va.localeCompare(vb) : vb.localeCompare(va);
        return asc ? va - vb : vb - va;
    });
}

function buildSparkline(values, width, height) {
    // values: [v0, v1, v2, v3] 从最早到最新（v3=当前周）
    if (!values || values.length < 2) return '';
    var valid = values.filter(function(v) { return v !== null && v !== undefined && isFinite(v); });
    if (valid.length < 2) return '';
    var min = Math.min.apply(null, valid); var max = Math.max.apply(null, valid);
    var range = max - min || 1;
    var pad = 2;
    var w = width - pad * 2; var h = height - pad * 2;
    // 反转：SVG y=0在顶部，准确率越高y越小
    var points = values.map(function(v, idx) {
        if (v === null || v === undefined || !isFinite(v)) return null;
        var x = pad + (idx / (values.length - 1)) * w;
        var y = pad + (1 - (v - min) / range) * h;
        return x.toFixed(1) + ',' + y.toFixed(1);
    }).filter(function(p) { return p !== null; });
    if (points.length < 2) return '';
    var polyline = '<polyline points="' + points.join(' ') + '" fill="none" stroke="#2a5298" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>';
    var dots = '';
    points.forEach(function(p) {
        var xy = p.split(',');
        dots += '<circle cx="' + xy[0] + '" cy="' + xy[1] + '" r="2" fill="#2a5298"/>';
    });
    return '<svg width="' + width + '" height="' + height + '" style="vertical-align:middle;">' + polyline + dots + '</svg>';
}

function getTrendIcon(accHistory) {
    // accHistory: [w0, w1, w2, w3] w0=最远, w3=当前
    if (!accHistory || accHistory.length < 2) return '<span class="text-muted">--</span>';
    var valid = accHistory.filter(function(v) { return v !== null; });
    if (valid.length < 2) return '<span class="text-muted">--</span>';
    // 直接对比最近两周：当前 vs 上周
    var current = valid[valid.length - 1];
    var previous = valid[valid.length - 2];
    var delta = current - previous;
    if (Math.abs(delta) < 0.01) return '<span style="color:#2980b9;font-size:1.1rem;">→</span>';
    if (delta > 0) return '<span style="color:#27ae60;font-size:1.1rem;">↑</span>';
    return '<span style="color:#c0392b;font-size:1.1rem;">↓</span>';
}

function renderPersonTable(weekData, allWeeks) {
    // 缓存全部周数据供弹窗使用
    window._allWeeksCache = allWeeks;

    var stats = sortPersonStats(weekData.personStats, personSortCol, personSortAsc);

    // 构建每人最近4周准确率历史（索引0=最远, 索引N-1=当前周，没数据的周填null占位）
    var accHistoryMap = {};
    var maxWeeks = Math.min(allWeeks.length, 4);
    stats.forEach(function(p) { accHistoryMap[p.name] = new Array(maxWeeks).fill(100); });
    for (var wi = maxWeeks - 1; wi >= 0; wi--) {
        var wd = allWeeks[wi];
        if (!wd || !wd.personStats) continue;
        var idx = maxWeeks - 1 - wi; // 当前周=最后一个位置
        wd.personStats.forEach(function(ps) {
            if (accHistoryMap[ps.name] !== undefined) {
                accHistoryMap[ps.name][idx] = ps.accuracy;
            }
        });
    }

    var tbody = '';

    // === 总计行（置于表格顶部）===
    var totalSamplingAll = 0, totalPanZeAll = 0, totalErrorsAll = 0;
    stats.forEach(function(p) { totalSamplingAll += p.sampling; totalPanZeAll += (p.panZe || 0); totalErrorsAll += p.errors; });
    var totalCoverageAll = totalPanZeAll > 0 ? (totalSamplingAll / totalPanZeAll * 100) : 0;
    var totalAccuracyAll = totalSamplingAll > 0 ? ((totalSamplingAll - totalErrorsAll) / totalSamplingAll * 100) : 100;

    // 计算总计的跨周趋势
    var totalAccHistory = [];
    for (var tw = Math.min(allWeeks.length, 4) - 1; tw >= 0; tw--) {
        var twd = allWeeks[tw];
        if (!twd || !twd.personStats) continue;
        var twSampling = 0, twErrors = 0;
        twd.personStats.forEach(function(ps) { twSampling += ps.sampling; twErrors += ps.errors; });
        totalAccHistory.push(twSampling > 0 ? ((twSampling - twErrors) / twSampling * 100) : 100);
    }
    var totalSpark = buildSparkline(totalAccHistory, 88, 22);
    var totalTrendIcon = getTrendIcon(totalAccHistory);

    var totalAccColor = totalAccuracyAll >= 99.95 ? "#27ae60" : (totalAccuracyAll <= 99 ? "#c0392b" : "#f39c12");

    tbody += "<tr style=\"background:#f1f5f9;font-weight:700;border-bottom:3px solid #2a5298;cursor:pointer;\" onclick=\"showTotalTrendPopup()\" title=\"点击查看整体趋势\">" +
        "<td style=\"text-align:center;\">📊</td>" +
        "<td class=\"col-name\" style=\"font-weight:700;\">总计 <span style=\"font-weight:400;color:#5e6f8d;\">(" + stats.length + "人)</span></td>" +
        "<td style=\"text-align:center;\">--</td>" +
        "<td class=\"col-num\">" + totalSamplingAll + "</td>" +
        "<td class=\"col-num\">" + totalPanZeAll + "</td>" +
        "<td class=\"col-num\">" + (totalPanZeAll > 0 ? totalCoverageAll.toFixed(2) + "%" : "--") + "</td>" +
        "<td class=\"col-num\">" + totalErrorsAll + "</td>" +
        "<td class=\"col-num fw-600\" style=\"color:" + totalAccColor + "\">" + totalAccuracyAll.toFixed(2) + "%</td>" +
        "<td class=\"col-num\">" + (totalSpark || "<span class=\"text-muted\">--</span>") + "</td>" +
        "<td class=\"text-center\">" + totalTrendIcon + "</td>" +
        "</tr>";

    stats.forEach(function(p, i) {
        var accHistory = accHistoryMap[p.name] || [];
        var sparklineHTML = buildSparkline(accHistory, 88, 22);
        var trendIcon = getTrendIcon(accHistory);

        var siteClass = '';
        if (p.site === '深圳') siteClass = 'sz';
        else if (p.site === '青岛') siteClass = 'qd';
        else if (p.site === '成都') siteClass = 'cd';

        // 准确率颜色：≤99%红色, 99.1-99.99%渐变, 100%绿色
        var accColor, lightTag;
        if (p.accuracy >= 99.95) {
            accColor = '#27ae60'; lightTag = '<span class="tag tag-green">🟢</span>';
        } else if (p.accuracy <= 99) {
            accColor = '#c0392b'; lightTag = '<span class="tag tag-red">🔴</span>';
        } else {
            var hue = (p.accuracy - 99) / 1 * 120; // 99%→红(h=0), 100%→绿(h=120)
            accColor = 'hsl(' + hue.toFixed(0) + ', 60%, 45%)';
            lightTag = '<span class="tag tag-yellow">🟡</span>';
        }
        var lightClass = p.accuracy >= 99.95 ? 'row-green' : (p.accuracy <= 99 ? 'row-red' : 'row-yellow');

        tbody += '<tr class="' + lightClass + '">' +
            '<td>' + (i + 1) + '</td>' +
            '<td class="col-name"><span class="clickable" onclick="showPersonDetail(\'' + p.name.replace(/'/g, "\\'") + '\')">' + p.name + '</span></td>' +
            '<td>' + (p.site ? '<span class="site-tag ' + siteClass + '">' + p.site + '</span>' : '--') + '</td>' +
            '<td class="col-num fw-600">' + p.sampling + '</td>' +
            '<td class="col-num fw-600">' + (p.panZe || 0) + '</td>' +
            '<td class="col-num">' + (p.panZe > 0 ? p.coverage.toFixed(2) + '%' : '--') + '</td>' +
            '<td class="col-num">' + p.errors + '</td>' +
            '<td class="col-num fw-600" style="color:' + accColor + '">' + p.accuracy.toFixed(2) + '% ' + lightTag + '</td>' +
            '<td class="col-num">' + (sparklineHTML || '<span class="text-muted">--</span>') + '</td>' +
            '<td class="text-center">' + trendIcon + '</td>' +
            '</tr>';
    });

    document.getElementById('personTbody').innerHTML = tbody;
    var droppedNames = weekData.droppedPanZeNames || [];
    document.getElementById('personMeta').textContent = '共 ' + stats.length + ' 人 | 抽检覆盖 ' + weekData.sampledCount + ' 人 | 失误 ' + weekData.personStats.filter(function(p) { return p.errors > 0; }).length + ' 人 | 判责合计 ' + weekData.judgmentCount + ' 单' + (droppedNames.length > 0 ? ' | ⚠️ 无站点归属未计入判责: ' + droppedNames.join('、') : '');

    // 更新排序箭头
    document.querySelectorAll('#personTable .sortable .sort-arrow').forEach(function(el) { el.textContent = ''; });
    var activeTh = document.querySelector('#personTable .sortable[data-sort="' + personSortCol + '"] .sort-arrow');
    if (activeTh) activeTh.textContent = personSortAsc ? '▲' : '▼';
}

function renderErrorAnalysis(weekData, prevWeekData) {
    var src = activeErrorTab;
    var catStats = weekData.categoryStats[src] || [];
    var prevCatMap = {};
    if (prevWeekData && prevWeekData.categoryStats[src]) {
        prevWeekData.categoryStats[src].forEach(function(c) { prevCatMap[c.name] = c.count; });
    }

    var totalErrors = weekData.errorsBySource ? weekData.errorsBySource[src] : (
        src === '初审' ? weekData.csErrors : (src === '抽检' ? weekData.cjErrors : weekData.qaErrors)
    );

    var prevTotal = prevWeekData ? (
        src === '初审' ? prevWeekData.csErrors : (src === '抽检' ? prevWeekData.cjErrors : prevWeekData.qaErrors)
    ) : 0;

    var totalTrend = prevWeekData ? computeTrend(totalErrors, prevTotal) : null;

    // 汇总统计
    var summaryHTML = '<div class="error-summary">' +
        '<div class="es-title">📊 本周汇总</div>' +
        '<div class="es-stat"><span>失误总数</span><span class="es-val">' + totalErrors + ' 条</span></div>' +
        '<div class="es-stat"><span>失误类别数</span><span class="es-val">' + catStats.length + ' 个</span></div>' +
        '<div class="es-stat"><span>涉及人员</span><span class="es-val">' + weekData.personStats.filter(function(p) { return src === '初审' ? p.errorsCS > 0 : (src === '抽检' ? p.errorsCJ > 0 : p.errorsQA > 0); }).length + ' 人</span></div>';
    if (totalTrend) {
        summaryHTML += '<div class="es-stat"><span>环比上周</span><span class="es-val ' + totalTrend.cls + '">' + totalTrend.text + '（上周: ' + prevTotal + '条）</span></div>';
    }
    summaryHTML += '</div>';

    // Top 类别
    var topHTML = '<div class="error-toplist"><div class="et-title">📈 Top 5 失误类别</div>';
    if (catStats.length === 0) {
        topHTML += '<div class="text-muted text-sm">本周无失误记录</div>';
    } else {
        var maxCount = catStats[0] ? catStats[0].count : 1;
        catStats.slice(0, 5).forEach(function(c, i) {
            var pct = totalErrors > 0 ? (c.count / totalErrors * 100).toFixed(2) : 0;
            var barW = totalErrors > 0 ? (c.count / totalErrors * 100).toFixed(0) : 0;
            var prevCount = prevCatMap[c.name] || 0;
            var deltaStr = '';
            if (prevWeekData) {
                if (prevCount > 0 && c.count !== prevCount) {
                    var d = c.count - prevCount;
                    deltaStr = ' <span style="font-size:0.7rem;' + (d > 0 ? 'color:#c0392b' : 'color:#27ae60') + '">' + (d > 0 ? '↑' : '↓') + Math.abs(d) + '</span>';
                } else if (prevCount === 0 && c.count > 0) {
                    deltaStr = ' <span style="font-size:0.7rem;color:#c0392b;">新增</span>';
                } else if (prevCount > 0 && c.count === prevCount) {
                    deltaStr = ' <span style="font-size:0.7rem;color:#5e6f8d;">→持平</span>';
                }
            }
            topHTML += '<div class="et-item">' +
                '<span class="et-rank">' + (i + 1) + '</span>' +
                '<span class="et-cat" title="' + c.name + '">' + c.name + '</span>' +
                '<div class="et-bar-wrap"><div class="et-bar cat-' + i + '" style="width:' + barW + '%"></div></div>' +
                '<span class="et-count">' + c.count + ' (' + pct + '%)</span>' +
                '<span class="et-trend">' + deltaStr + '</span>' +
                '</div>';
        });
    }
    topHTML += '</div>';

    // 失误明细表
    var weekErrors = allErrors.filter(function(e) {
        return e.source === src && isInWeek(e.date, weekData.monday, weekData.sunday) && siteMatch(e, currentSite);
    });
    var detailHTML = '<div style="margin-top:16px;"><div style="font-weight:600;margin-bottom:10px;color:var(--primary);">📋 ' + src + '失误明细</div>';
    if (weekErrors.length === 0) {
        detailHTML += '<div class="text-muted text-sm" style="padding:20px;text-align:center;">暂无失误记录</div>';
    } else {
        detailHTML += '<div class="table-wrap"><table class="data-table"><thead><tr>' +
            '<th>日期</th><th>站点</th><th>品类</th><th>失误类别</th><th>人员</th><th>备注</th><th>质检码</th>' +
            '</tr></thead><tbody>';
        // 分组优先级：低级/投诉(0) 最顶 → 明显失误/扣错项(1) → 其他(2)；组内按类别数量降序，同类内日期降序
        function errPriority(cat) {
            var c = cat || '';
            if (c.indexOf('低级') >= 0 || c.indexOf('投诉') >= 0) return 0;
            if (c.indexOf('明显失误') >= 0 || c.indexOf('扣错项') >= 0) return 1;
            return 2;
        }
        var catCountMap = {};
        var personCatCountMap = {};
        weekErrors.forEach(function(e) {
            catCountMap[e.category] = (catCountMap[e.category] || 0) + 1;
            var pk = e.category + '|' + e.reviewer;
            personCatCountMap[pk] = (personCatCountMap[pk] || 0) + 1;
        });
        weekErrors.sort(function(a, b) {
            var gp = errPriority(a.category) - errPriority(b.category);
            if (gp !== 0) return gp;
            var cntCmp = (catCountMap[b.category] || 0) - (catCountMap[a.category] || 0);
            if (cntCmp !== 0) return cntCmp;
            // 同类内：同一失误人员聚合，该人在此类别失误数多的在前
            var pCmp = (personCatCountMap[b.category + '|' + b.reviewer] || 0) - (personCatCountMap[a.category + '|' + a.reviewer] || 0);
            if (pCmp !== 0) return pCmp;
            var nameCmp = (a.reviewer || '').localeCompare(b.reviewer || '', 'zh');
            if (nameCmp !== 0) return nameCmp;
            return b.date - a.date;        // 同人内日期新的在前
        });

        weekErrors.forEach(function(e) {
            var searchText = [e.dateStr || '', e.site || '', e.product || '', e.category || '', e.reviewer || '', e.note || '', e.qcCode || ''].join('|').toLowerCase();
            var siteClass = '';
            if (e.site === '深圳') siteClass = 'sz';
            else if (e.site === '青岛') siteClass = 'qd';
            else if (e.site === '成都') siteClass = 'cd';
            var rowClass = '';
            if (e.category.indexOf('低级') >= 0 || e.category.indexOf('投诉') >= 0) rowClass = ' class="row-err-low"';
            else if (e.category.indexOf('明显失误') >= 0 || e.category.indexOf('扣错项') >= 0) rowClass = ' class="row-err-mid"';
            detailHTML += '<tr' + rowClass + ' data-search="' + searchText + '">' +
                '<td>' + formatShortDate(e.date) + '</td>' +
                '<td>' + (e.site ? '<span class="site-tag ' + siteClass + '">' + e.site + '</span>' : '--') + '</td>' +
                '<td>' + (e.product || '--') + '</td>' +
                '<td>' + e.category + '</td>' +
                '<td>' + e.reviewer + '</td>' +
                '<td style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="' + (e.note || '') + '">' + (e.note || '--') + '</td>' +
                '<td>' + (e.qcCode || '--') + '</td>' +
                '</tr>';
        });
        detailHTML += '</tbody></table></div>';
    }
    // 问题点解析 + 改善方向（竖向排列）
    var noteKey = 'qc_note_' + currentSite + '_' + src + '_' + formatDate(weekData.monday);
    detailHTML += '<div style="margin-bottom:10px;">' +
        '<div style="margin-bottom:8px;"><div style="font-size:0.78rem;font-weight:600;color:var(--primary);margin-bottom:4px;">🔎 问题点解析</div>' +
        '<textarea id="errorAnalysisNote" data-note-key="' + noteKey + '" placeholder="记录本周失误的问题点分析…" style="width:100%;height:72px;padding:8px 10px;border:1px solid #cbd5e1;border-radius:6px;font-size:0.78rem;font-family:inherit;resize:vertical;outline:none;"></textarea></div>' +
        '<div><div style="font-size:0.78rem;font-weight:600;color:var(--primary);margin-bottom:4px;">💡 改善方向</div>' +
        '<textarea id="errorImproveNote" data-note-key="' + noteKey + '" placeholder="记录对应的改善措施和方向…" style="width:100%;height:72px;padding:8px 10px;border:1px solid #cbd5e1;border-radius:6px;font-size:0.78rem;font-family:inherit;resize:vertical;outline:none;"></textarea></div>' +
    '</div>';
    detailHTML += '</div>';

    document.getElementById('errorTabContent').innerHTML =
        '<div class="error-analysis-grid">' + summaryHTML + topHTML + '</div>' + detailHTML;

    // 恢复已保存的问题点解析和改善方向
    var savedAnalysis = localStorage.getItem(noteKey + '_analysis');
    var savedImprove = localStorage.getItem(noteKey + '_improve');
    var taAnalysis = document.getElementById('errorAnalysisNote');
    var taImprove = document.getElementById('errorImproveNote');
    if (taAnalysis) {
        if (savedAnalysis) taAnalysis.value = savedAnalysis;
        taAnalysis.oninput = function() { localStorage.setItem(noteKey + '_analysis', this.value); };
    }
    if (taImprove) {
        if (savedImprove) taImprove.value = savedImprove;
        taImprove.oninput = function() { localStorage.setItem(noteKey + '_improve', this.value); };
    }
}

// 总计行趋势弹窗
function showTotalTrendPopup() {
    var allWeeks = window._allWeeksCache || [];

            "<td>" + tCov.toFixed(2) + "%</td>" +
            "<td>" + tErrors + "</td>" +
            "<td style=\"font-weight:600;color:" + (tAcc >= 99.95 ? "#27ae60" : tAcc <= 99 ? "#c0392b" : "#f39c12") + "\">" + tAcc.toFixed(2) + "%</td>" +
            "</tr>";
    });

    var siteLabel = currentSite === "all" ? "全部站点" : currentSite + "站点";

        "<div class=\"modal-body\">" +

            "</tr></thead><tbody>" + rows + "</tbody></table></div>" +
